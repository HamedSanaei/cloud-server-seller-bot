name: deploy-production

# Production is explicit: current main, successful exact-SHA release CI,
# affirmative manual dispatch, and the protected production Environment.
# Staging automatically updates this same runtime through its protected branch.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-char commit SHA to deploy (must be current main HEAD with successful CI)"
        required: true
        type: string
      confirm_production:
        description: "Approve deployment to Production"
        type: boolean
        required: true
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  actions: read

env:
  REGISTRY: ghcr.io

jobs:
  policy:
    name: Require explicit production approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject unapproved or wrong-branch requests
        env:
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch &&
             "$GITHUB_REF" == refs/heads/main &&
             "$CONFIRM_PRODUCTION" == true &&
             "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Production requires explicit confirmation on main and a full commit SHA"
            exit 1
          }
  build:
    name: Build immutable image
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Both lanes can build the same commit; serialize the inspect/push pair.
    concurrency:
      group: immutable-image-${{ inputs.sha }}
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_production
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      image: ${{ steps.resolve.outputs.image }}
      head: ${{ steps.revision.outputs.head }}
      ci_run_id: ${{ steps.ci.outputs.ci_run_id }}
    steps:
      - name: Resolve deployment SHA
        id: resolve
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          set -Eeuo pipefail
          sha="${REQUESTED_SHA}"
          if ! printf '%s' "${sha}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "deployment SHA must be a full 40-char hex commit, got '${sha}'"
            exit 1
          fi
          repo_lower="$(printf '%s' "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          image="${{ env.REGISTRY }}/${repo_lower}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "deploying commit ${sha} as ${image}:${sha}"

      - name: Require successful release CI for the exact SHA
        id: ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -Eeuo pipefail
          # API proof precedes checkout: never execute source from an untrusted run.
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [ "$RELEASE_SHA" = "$current_main" ] || {
            echo "Release SHA is stale: only current main HEAD may deploy"
            exit 1
          }
          run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${RELEASE_SHA}&branch=main&event=push&per_page=1" --jq '.workflow_runs[0].id // empty')"
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "No exact release CI run found"; exit 1; }
          trusted="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq \
            '(.path == ".github/workflows/ci.yml" and .status == "completed" and .conclusion == "success" and .event == "push" and .head_branch == "main" and .head_sha == "'"$RELEASE_SHA"'" and .repository.full_name == "'"$GITHUB_REPOSITORY"'" and .head_repository.full_name == "'"$GITHUB_REPOSITORY"'")')"
          [ "$trusted" = true ] || { echo "Release CI is not a trusted successful main push"; exit 1; }
          echo "ci_run_id=${run_id}" >> "${GITHUB_OUTPUT}"

      - name: Check out the exact tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the immutable tag already exists
        id: exists
        run: |
          set -Eeuo pipefail
          error_file="${RUNNER_TEMP}/manifest-inspect.err"
          if docker manifest inspect \
            "${{ steps.resolve.outputs.image }}:${{ steps.resolve.outputs.sha }}" >/dev/null 2>"$error_file"; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          elif grep -Eq 'manifest unknown|no such manifest' "$error_file"; then
            echo "present=false" >> "${GITHUB_OUTPUT}"
          else
            cat "$error_file" >&2
            echo "Cannot prove the SHA tag is absent; refusing to overwrite it" >&2
            exit 1
          fi

      - name: Build and push the immutable image
        if: steps.exists.outputs.present != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: RELEASE_REVISION=${{ steps.resolve.outputs.sha }}
          push: true
          tags: ${{ steps.resolve.outputs.image }}:${{ steps.resolve.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the pushed image and production compose
        run: |
          set -Eeuo pipefail
          ref="${{ steps.resolve.outputs.image }}:${{ steps.resolve.outputs.sha }}"
          docker pull "${ref}"
          # Entrypoint smoke: proves the image starts and the entrypoint is
          # intact (alembic --help needs no database).
          docker run --rm "${ref}" migrate --help >/dev/null
          echo "image entrypoint smoke: ok"
          # Production compose must interpolate with the release image.
          # POSTGRES_PASSWORD here is a local validation placeholder, never a
          # credential; the real value lives only in the server deploy.env.
          PLATFORM_IMAGE="${ref}"
          POSTGRES_PASSWORD=ci-validation-only  # pragma: allowlist secret
          export PLATFORM_IMAGE POSTGRES_PASSWORD
          docker compose -f deploy/production/docker-compose.yml config >/dev/null
          echo "production compose config: ok"

      - name: Resolve expected migration head
        id: revision
        run: |
          set -Eeuo pipefail
          head="$(python3 -c "import sys; sys.path.insert(0, 'scripts'); import post_deploy_smoke; print(post_deploy_smoke.repo_head_revision())")"
          [ -n "${head}" ] || { echo "could not resolve the alembic head"; exit 1; }
          echo "head=${head}" >> "${GITHUB_OUTPUT}"
          echo "expected alembic head: ${head}"

  deploy:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    # Both branches share this job group and the on-host website/platform lock.
    concurrency:
      group: platform-production-deploy
      cancel-in-progress: false
    steps:
      - name: Recheck current main and release CI before host access
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
          CI_RUN_ID: ${{ needs.build.outputs.ci_run_id }}
        run: |
          set -Eeuo pipefail
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [ "$RELEASE_SHA" = "$current_main" ] || { echo "Release SHA is stale; refusing host access"; exit 1; }
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Missing validated CI run"; exit 1; }
          trusted="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}" --jq \
            '(.path == ".github/workflows/ci.yml" and .status == "completed" and .conclusion == "success" and .event == "push" and .head_branch == "main" and .head_sha == "'"$RELEASE_SHA"'" and .repository.full_name == "'"$GITHUB_REPOSITORY"'" and .head_repository.full_name == "'"$GITHUB_REPOSITORY"'")')"
          [ "$trusted" = true ] || { echo "Release CI proof is no longer valid"; exit 1; }

      - name: Check out the exact tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 1

      - name: Open SSH (ephemeral key file, verified host key)
        run: |
          set -Eeuo pipefail
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${{ secrets.PROD_SSH_KEY }}" > "${HOME}/.ssh/prod_key"
          chmod 600 "${HOME}/.ssh/prod_key"
          printf '%s\n' "${{ secrets.PROD_KNOWN_HOSTS }}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"
          [ -s "${HOME}/.ssh/prod_key" ] || { echo "PROD_SSH_KEY is empty"; exit 1; }
          [ -s "${HOME}/.ssh/known_hosts" ] || { echo "PROD_KNOWN_HOSTS is empty"; exit 1; }
          [ -n "${{ vars.PROD_HOST }}" ] || { echo "PROD_HOST variable is not set"; exit 1; }
          [ -n "${{ vars.PROD_USER }}" ] || { echo "PROD_USER variable is not set"; exit 1; }
          [ -n "${{ vars.PROD_DEPLOY_PATH }}" ] || { echo "PROD_DEPLOY_PATH variable is not set"; exit 1; }
          echo "ssh material ready (key never printed)"


      - name: Deliver release compose candidate
        id: compose
        run: |
          set -Eeuo pipefail
          # The exact compose file from the exact tested checkout travels
          # with the release: image, compose contract, and migration
          # expectation always share one validated SHA. Workflow-run's
          # default-branch context cannot silently supply a different compose:
          # a mixed image/compose release is impossible.
          sha="${{ needs.build.outputs.sha }}"
          candidate=".docker-compose.${sha}.candidate.yml"
          compose_sha="$(sha256sum deploy/production/docker-compose.yml | awk '{print $1}')"
          echo "candidate=${candidate}" >> "${GITHUB_OUTPUT}"
          echo "sha256=${compose_sha}" >> "${GITHUB_OUTPUT}"
          echo "release compose candidate ${candidate}: ${compose_sha}"
          ssh -i "${HOME}/.ssh/prod_key" \
            -p "${{ vars.PROD_PORT || 22 }}" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            "${{ vars.PROD_USER }}@${{ vars.PROD_HOST }}" \
            "cat > '${{ vars.PROD_DEPLOY_PATH }}/${candidate}'" \
            < deploy/production/docker-compose.yml

      - name: Deploy the exact image over SSH
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          # Login and deployment share one remote lifetime: authentication
          # never touches ~/.docker and is removed on success or failure.
          remote_command="$(cat <<'REMOTE'
          set -Eeuo pipefail
          DOCKER_CONFIG="$(mktemp -d)"
          export DOCKER_CONFIG
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          IFS= read -r GHCR_TOKEN
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          unset GHCR_TOKEN
          DEPLOY_PATH='${{ vars.PROD_DEPLOY_PATH }}' PLATFORM_IMAGE_NEW='${{ needs.build.outputs.image }}:${{ needs.build.outputs.sha }}' EXPECTED_HEAD='${{ needs.build.outputs.head }}' CANDIDATE_COMPOSE_FILE='${{ vars.PROD_DEPLOY_PATH }}/${{ steps.compose.outputs.candidate }}' EXPECTED_COMPOSE_SHA256='${{ steps.compose.outputs.sha256 }}' bash -s
          REMOTE
          )"
          # Encode only the command, not credentials. This preserves quoting
          # through any POSIX login shell without consuming the token/script.
          remote_command="$(printf '%s' "$remote_command" | base64 -w0)"
          { printf '%s\n' "$GHCR_TOKEN"; cat scripts/deploy-production.sh; } |
            ssh -i "${HOME}/.ssh/prod_key" \
              -p "${{ vars.PROD_PORT || 22 }}" \
              -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
              -o ConnectTimeout=15 \
              "${{ vars.PROD_USER }}@${{ vars.PROD_HOST }}" \
              "bash -c \"\$(printf '%s' '$remote_command' | base64 --decode)\""

      - name: Report deployment
        if: always()
        run: |
          echo "commit: ${{ needs.build.outputs.sha }}"
          echo "image: ${{ needs.build.outputs.image }}:${{ needs.build.outputs.sha }}"
          echo "environment: production"
          echo "expected alembic head: ${{ needs.build.outputs.head }}"
          echo "target: ${{ vars.PROD_USER }}@${{ vars.PROD_HOST }}:${{ vars.PROD_DEPLOY_PATH }}"


      - name: Remove ephemeral SSH key
        if: always()
        run: rm -f "${HOME}/.ssh/prod_key"
