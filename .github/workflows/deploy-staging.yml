name: deploy-staging

# Staging is the automatic fast release lane for the SAME production runtime.
# It reuses the production deploy path, private TOML, DB, Redis and Telegram bot;
# no second stack or bot poller is created. Targeted checks guard staging;
# main retains the full release CI suite and coverage gate.

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: staging-deploy
  # Never cancel a deployment that may already be migrating.
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Avoid hardlink/permission flakiness of cached virtualenvs between runners.
  UV_LINK_MODE: copy

jobs:
  deployment-access:
    name: Validate staging deployment prerequisites
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Require environment-scoped CI deployment identity before publishing
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          CONFIGURATION_PATH: ${{ vars.CONFIGURATION_PATH }}
        run: |
          set -Eeuo pipefail
          [[ -n "$DEPLOY_HOST" && -n "$DEPLOY_USER" && -n "$SSH_KEY" && -n "$KNOWN_HOSTS" ]] || {
            echo "::error::staging requires DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS; production secrets are not inherited"; exit 1;
          }
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ && "$CONFIGURATION_PATH" =~ ^/[A-Za-z0-9._/-]+\.toml$ ]] || {
            echo "::error::Configure staging DEPLOY_PATH and CONFIGURATION_PATH for the existing runtime"; exit 1;
          }

  checks:
    name: Required staging checks
    uses: ./.github/workflows/staging-checks.yml
    permissions:
      contents: read

  build:
    name: Build immutable image
    needs: [checks, deployment-access]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: immutable-image-${{ github.sha }}
      cancel-in-progress: false
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      image: ${{ steps.resolve.outputs.image }}
      head: ${{ steps.resolve.outputs.head }}
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Resolve the staging SHA, image and expected alembic head
        id: resolve
        run: |
          set -Eeuo pipefail
          # Pushes and manual dispatches on staging deploy the exact
          # validated staging SHA after the financial/migration gates pass.
          # A feature branch is never deployable here.
          [ "${{ github.ref }}" = "refs/heads/staging" ] \
            || { echo "deploy-staging only runs on refs/heads/staging"; exit 1; }
          sha="${{ github.sha }}"
          if ! printf '%s' "${sha}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "deployment SHA must be a full 40-char hex commit, got '${sha}'"
            exit 1
          fi
          repo_lower="$(printf '%s' "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          image="${{ env.REGISTRY }}/${repo_lower}"
          head="$(python3 -c "import sys; sys.path.insert(0, 'scripts'); import post_deploy_smoke; print(post_deploy_smoke.repo_head_revision())")"
          [ -n "${head}" ] || { echo "could not resolve the alembic head"; exit 1; }
          {
            echo "sha=${sha}"
            echo "image=${image}"
            echo "head=${head}"
          } >> "${GITHUB_OUTPUT}"
          echo "deploying commit ${sha} as ${image}:${sha} (expected alembic head ${head})"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the immutable tag already exists
        id: exists
        run: |
          set -Eeuo pipefail
          error_file="${RUNNER_TEMP}/manifest-inspect.err"
          if docker manifest inspect \
            "${{ steps.resolve.outputs.image }}:${{ steps.resolve.outputs.sha }}" >/dev/null 2>"$error_file"; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          elif grep -Eq 'manifest unknown|no such manifest' "$error_file"; then
            echo "present=false" >> "${GITHUB_OUTPUT}"
          else
            cat "$error_file" >&2
            echo "Cannot prove the SHA tag is absent; refusing to overwrite it" >&2
            exit 1
          fi

      # Reuse an existing SHA tag; never publish a floating deployment tag.
      - name: Build and push the immutable image
        if: steps.exists.outputs.present != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: RELEASE_REVISION=${{ steps.resolve.outputs.sha }}
          push: true
          tags: ${{ steps.resolve.outputs.image }}:${{ steps.resolve.outputs.sha }}
          cache-from: type=gha,scope=platform
          cache-to: type=gha,scope=platform,mode=max

  deploy:
    name: Deploy shared production from staging
    needs: build
    if: github.ref == 'refs/heads/staging' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Backup/migration plus bounded cold-start/health windows on the shared host.
    timeout-minutes: 45
    environment: staging
    # The active deploy is never cancelled. GitHub may coalesce pending jobs.
    concurrency:
      group: platform-production-deploy
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      CONFIGURATION_PATH: ${{ vars.CONFIGURATION_PATH }}
    steps:
      - name: Check out the exact pushed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 1

      - name: Require the shared production target and verified SSH identity
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          [[ -n "$DEPLOY_HOST" && -n "$DEPLOY_USER" && -n "$SSH_KEY" && -n "$KNOWN_HOSTS" ]] || {
            echo "::error::Configure this staging release lane's DEPLOY_* SSH secrets"; exit 1;
          }
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ && "$CONFIGURATION_PATH" =~ ^/[A-Za-z0-9._/-]+\.toml$ ]] || {
            echo "::error::DEPLOY_PATH and CONFIGURATION_PATH must select the existing production runtime"; exit 1;
          }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" >/dev/null

      - name: Recheck the tested branch HEAD before any remote mutation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
        run: |
          set -Eeuo pipefail
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/staging" --jq '.object.sha')"
          [[ "$current" == "$RELEASE_SHA" ]] || {
            echo "::error::Refusing a stale staging release"; exit 1;
          }


      - name: Deliver release compose candidate
        id: compose
        run: |
          set -Eeuo pipefail
          # The compose contract travels from the same exact commit as the
          # image, so a staging release can never mix an image with another
          # commit's compose file.
          sha="${{ needs.build.outputs.sha }}"
          # Retries/parallel lanes must never overwrite an active release artifact.
          candidate=".docker-compose.${sha}.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.candidate.yml"
          compose_sha="$(sha256sum deploy/production/docker-compose.yml | awk '{print $1}')"
          echo "candidate=${candidate}" >> "${GITHUB_OUTPUT}"
          echo "sha256=${compose_sha}" >> "${GITHUB_OUTPUT}"
          echo "release compose candidate ${candidate}: ${compose_sha}"
          ssh -i "$HOME/.ssh/deploy_key" \
            -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "test -d '$DEPLOY_PATH' && cat > '${DEPLOY_PATH}/${candidate}'" \
            < deploy/production/docker-compose.yml

      - name: Deploy the validated staging image to the shared production runtime
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          RELEASE_IMAGE: ${{ needs.build.outputs.image }}:${{ needs.build.outputs.sha }}
          EXPECTED_HEAD: ${{ needs.build.outputs.head }}
          CANDIDATE: ${{ steps.compose.outputs.candidate }}
          COMPOSE_SHA: ${{ steps.compose.outputs.sha256 }}
        run: |
          set -Eeuo pipefail
          printf -v invoke 'DEPLOY_PATH=%q CONFIGURATION_PATH=%q PLATFORM_IMAGE_NEW=%q EXPECTED_HEAD=%q CANDIDATE_COMPOSE_FILE=%q EXPECTED_COMPOSE_SHA256=%q DEPLOY_PROFILE=staging bash -s' \
            "$DEPLOY_PATH" "$CONFIGURATION_PATH" "$RELEASE_IMAGE" "$EXPECTED_HEAD" "$DEPLOY_PATH/$CANDIDATE" "$COMPOSE_SHA"
          printf -v login "printf '%%s' \"\$registry_token\" | docker login ghcr.io -u %q --password-stdin >/dev/null" "$GHCR_ACTOR"
          cleanup="rm -rf -- \"\$DOCKER_CONFIG\""
          printf -v remote "set -Eeuo pipefail; DOCKER_CONFIG=\"\$(mktemp -d)\"; export DOCKER_CONFIG; trap %q EXIT; IFS= read -r registry_token; %s; unset registry_token GHCR_TOKEN; %s" "$cleanup" "$login" "$invoke"
          { printf '%s\n' "$GHCR_TOKEN"; cat scripts/deploy-production.sh; } |
            ssh -i "$HOME/.ssh/deploy_key" -p "${DEPLOY_PORT:-22}" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 \
              "${DEPLOY_USER}@${DEPLOY_HOST}" "$remote"

      - name: Report deployment
        if: always()
        env:
          DEPLOYMENT_RESULT: ${{ job.status }}
        run: |
          echo "commit: ${{ needs.build.outputs.sha }}"
          echo "image: ${{ needs.build.outputs.image }}:${{ needs.build.outputs.sha }}"
          echo "lane: staging; runtime: production (cloud-platform-production)"
          echo "expected alembic head: ${{ needs.build.outputs.head }}"
          if [ "$DEPLOYMENT_RESULT" = success ]; then
            echo "Canonical platform deployment verified (single Telegram poller)."
          else
            echo "::warning::Platform deployment was not verified; inspect the failed step and runtime before retrying."
          fi


      - name: Remove ephemeral SSH key
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key"
