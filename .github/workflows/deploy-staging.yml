name: deploy-staging

# Pushes validate/build only. Only explicit dispatch can replace the shared
# production host/bot with staging, after all financial/migration gates pass.
#
# Reused infrastructure configuration (no duplicates, no second stack):
#   * the existing environment secrets/variables: PROD_SSH_KEY,
#     PROD_KNOWN_HOSTS, PROD_HOST, PROD_USER, PROD_PORT, PROD_DEPLOY_PATH;
#   * the same server, the same server-owned deploy.env/configuration.toml
#     (bot token, database, redis, provider credentials) and the same compose
#     project `cloud-platform-production`, whose `bot` service is pinned to
#     replicas: 1 and gated to exactly one container by the deploy script.
#   * `deploy/staging/docker-compose.yml` (M12-004) is NOT used by this lane:
#     that artifact describes a separate isolated stack; this lane replaces
#     the one running stack.
#
# Concurrency: never cancel a run that may already be migrating or replacing
# services. Pending pushes may coalesce, but the active deployment finishes.
# Critical financial regressions and isolated PostgreSQL migration contracts
# execute in this lane because it shares production's financial database.
#
# The deploy job additionally joins `telegram-shared-host-deploy` with
# cancel-in-progress: false, because staging and automatic production releases
# mutate the SAME host and deploy path and must never run concurrently.

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: staging-deploy
  # Never cancel a workflow after it has entered shared-host mutations.
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Avoid hardlink/permission flakiness of cached virtualenvs between runners.
  UV_LINK_MODE: copy

jobs:
  fast-checks:
    name: Fast staging checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # This lane shares the financial database with production. Critical
    # regressions and migration paths must execute before any image deploys.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cloud
          POSTGRES_PASSWORD: cloud # pragma: allowlist secret -- disposable CI service
          POSTGRES_DB: cloud
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cloud -d cloud"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://cloud:cloud@localhost:5432/cloud # pragma: allowlist secret -- disposable CI service
      CLOUD_PLATFORM_TEST_POSTGRES_URL: postgresql+asyncpg://cloud:cloud@localhost:5432/cloud # pragma: allowlist secret -- disposable CI service
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true
      # --locked rejects lockfile drift; subsequent commands cannot re-resolve.
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Install PostgreSQL 17 backup and restore clients
        run: |
          sudo apt-get update
          if ! apt-cache show postgresql-client-17 >/dev/null 2>&1; then
            sudo apt-get install --yes postgresql-common
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            sudo apt-get update
          fi
          sudo apt-get install --yes postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/psql --version
      # Keep the canonical quick gate and add targeted database/financial
      # proofs below; staging does not duplicate the full release suite.
      - name: Fast gates (ruff, formatting, import smoke)
        run: uv run --no-sync python scripts/verify_ci.py --staging
      - name: Financial and deployment regression tests
        run: >-
          uv run --no-sync pytest tests/unit/test_payment*.py tests/unit/test_wallet*.py
          tests/unit/test_prepaid_hourly*.py
          tests/unit/test_deploy_production.py::TestReleaseComposeContract
          tests/unit/test_post_deploy_smoke.py tests/unit/test_audit_cicd.py
          tests/unit/test_financial*.py tests/unit/test_audit_worker_operations.py
          tests/unit/test_audit_provider_operations.py tests/unit/test_hourly_creation_boundaries.py
          tests/unit/test_gateway_management.py
          tests/unit/test_hetzner_offer_migration_pg.py --no-cov
      - name: Migration compatibility
        if: ${{ !cancelled() }}
        run: uv run --no-sync python scripts/check_migrations.py
      - name: Historical migration bridge
        if: ${{ !cancelled() }}
        run: uv run --no-sync pytest tests/live/test_migration_bridge.py --no-cov
      - name: Fresh PostgreSQL schema
        if: ${{ !cancelled() }}
        run: |
          uv run --no-sync alembic upgrade head
          uv run --no-sync python -m cloud_platform.db.schema_parity
      - name: Live PostgreSQL contracts
        if: ${{ !cancelled() }}
        run: >-
          uv run --no-sync pytest tests/live/test_postgres_*.py
          tests/live/test_financial_payment_outbox.py --no-cov

  build:
    name: Build immutable image
    needs: fast-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: immutable-image-${{ github.sha }}
      cancel-in-progress: false
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      image: ${{ steps.resolve.outputs.image }}
      head: ${{ steps.resolve.outputs.head }}
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Resolve the staging SHA, image and expected alembic head
        id: resolve
        run: |
          set -Eeuo pipefail
          # Only staging validates/builds through this lane. Pushes never
          # deploy; an explicit dispatch can deploy this checked staging SHA.
          # A feature branch is never deployable here.
          [ "${{ github.ref }}" = "refs/heads/staging" ] \
            || { echo "deploy-staging only runs on refs/heads/staging"; exit 1; }
          sha="${{ github.sha }}"
          if ! printf '%s' "${sha}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "deployment SHA must be a full 40-char hex commit, got '${sha}'"
            exit 1
          fi
          repo_lower="$(printf '%s' "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          image="${{ env.REGISTRY }}/${repo_lower}"
          head="$(python3 -c "import sys; sys.path.insert(0, 'scripts'); import post_deploy_smoke; print(post_deploy_smoke.repo_head_revision())")"
          [ -n "${head}" ] || { echo "could not resolve the alembic head"; exit 1; }
          {
            echo "sha=${sha}"
            echo "image=${image}"
            echo "head=${head}"
          } >> "${GITHUB_OUTPUT}"
          echo "deploying commit ${sha} as ${image}:${sha} (expected alembic head ${head})"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the immutable tag already exists
        id: exists
        run: |
          set -Eeuo pipefail
          error_file="${RUNNER_TEMP}/manifest-inspect.err"
          if docker manifest inspect \
            "${{ steps.resolve.outputs.image }}:${{ steps.resolve.outputs.sha }}" >/dev/null 2>"$error_file"; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          elif grep -Eq 'manifest unknown|no such manifest' "$error_file"; then
            echo "present=false" >> "${GITHUB_OUTPUT}"
          else
            cat "$error_file" >&2
            echo "Cannot prove the SHA tag is absent; refusing to overwrite it" >&2
            exit 1
          fi

      # Reuse an existing SHA tag; never publish a floating deployment tag.
      - name: Build and push the immutable image
        if: steps.exists.outputs.present != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: RELEASE_REVISION=${{ steps.resolve.outputs.sha }}
          push: true
          tags: ${{ steps.resolve.outputs.image }}:${{ steps.resolve.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to the current server
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The existing `production` environment is where PROD_SSH_KEY,
    # PROD_KNOWN_HOSTS and PROD_HOST/PROD_USER/PROD_PORT/PROD_DEPLOY_PATH live,
    # and staging intentionally reuses them instead of duplicating
    # infrastructure secrets. It has NO protection rules, so this adds no
    # approval step. If required reviewers are ever added to that environment,
    # staging deploys would inherit them - move those values to a shared
    # environment (or dedicated staging credentials) BEFORE enabling them.
    environment: production
    # The active deploy is never cancelled. GitHub may coalesce pending jobs.
    concurrency:
      group: telegram-shared-host-deploy
      cancel-in-progress: false
    steps:
      - name: Check out the exact pushed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 1

      - name: Open SSH (ephemeral key file, verified host key)
        run: |
          set -Eeuo pipefail
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${{ secrets.PROD_SSH_KEY }}" > "${HOME}/.ssh/prod_key"
          chmod 600 "${HOME}/.ssh/prod_key"
          printf '%s\n' "${{ secrets.PROD_KNOWN_HOSTS }}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"
          [ -s "${HOME}/.ssh/prod_key" ] || { echo "PROD_SSH_KEY is empty"; exit 1; }
          [ -s "${HOME}/.ssh/known_hosts" ] || { echo "PROD_KNOWN_HOSTS is empty"; exit 1; }
          [ -n "${{ vars.PROD_HOST }}" ] || { echo "PROD_HOST variable is not set"; exit 1; }
          [ -n "${{ vars.PROD_USER }}" ] || { echo "PROD_USER variable is not set"; exit 1; }
          [ -n "${{ vars.PROD_DEPLOY_PATH }}" ] || { echo "PROD_DEPLOY_PATH variable is not set"; exit 1; }
          echo "ssh material ready (key never printed)"


      - name: Deliver release compose candidate
        id: compose
        run: |
          set -Eeuo pipefail
          # The compose contract travels from the same exact commit as the
          # image, so a staging release can never mix an image with another
          # commit's compose file.
          sha="${{ needs.build.outputs.sha }}"
          candidate=".docker-compose.${sha}.candidate.yml"
          compose_sha="$(sha256sum deploy/production/docker-compose.yml | awk '{print $1}')"
          echo "candidate=${candidate}" >> "${GITHUB_OUTPUT}"
          echo "sha256=${compose_sha}" >> "${GITHUB_OUTPUT}"
          echo "release compose candidate ${candidate}: ${compose_sha}"
          ssh -i "${HOME}/.ssh/prod_key" \
            -p "${{ vars.PROD_PORT || 22 }}" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            "${{ vars.PROD_USER }}@${{ vars.PROD_HOST }}" \
            "cat > '${{ vars.PROD_DEPLOY_PATH }}/${candidate}'" \
            < deploy/production/docker-compose.yml

      - name: Deploy the exact image over SSH (staging profile)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          # DEPLOY_PROFILE=staging skips only the scheduled catalog refresh;
          # migrations, schema parity, single-bot and readiness stay enforced.
          remote_command="$(cat <<'REMOTE'
          set -Eeuo pipefail
          DOCKER_CONFIG="$(mktemp -d)"
          export DOCKER_CONFIG
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          IFS= read -r GHCR_TOKEN
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          unset GHCR_TOKEN
          DEPLOY_PATH='${{ vars.PROD_DEPLOY_PATH }}' PLATFORM_IMAGE_NEW='${{ needs.build.outputs.image }}:${{ needs.build.outputs.sha }}' EXPECTED_HEAD='${{ needs.build.outputs.head }}' CANDIDATE_COMPOSE_FILE='${{ vars.PROD_DEPLOY_PATH }}/${{ steps.compose.outputs.candidate }}' EXPECTED_COMPOSE_SHA256='${{ steps.compose.outputs.sha256 }}' DEPLOY_PROFILE='staging' bash -s
          REMOTE
          )"
          remote_command="$(printf '%s' "$remote_command" | base64 -w0)"
          { printf '%s\n' "$GHCR_TOKEN"; cat scripts/deploy-production.sh; } |
            ssh -i "${HOME}/.ssh/prod_key" \
              -p "${{ vars.PROD_PORT || 22 }}" \
              -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
              -o ConnectTimeout=15 \
              "${{ vars.PROD_USER }}@${{ vars.PROD_HOST }}" \
              "bash -c \"\$(printf '%s' '$remote_command' | base64 --decode)\""

      - name: Report deployment
        if: always()
        run: |
          echo "commit: ${{ needs.build.outputs.sha }}"
          echo "image: ${{ needs.build.outputs.image }}:${{ needs.build.outputs.sha }}"
          echo "lane: staging (current development server + the same Telegram bot)"
          echo "expected alembic head: ${{ needs.build.outputs.head }}"
          echo "target: ${{ vars.PROD_USER }}@${{ vars.PROD_HOST }}:${{ vars.PROD_DEPLOY_PATH }}"
          echo "bot processes for the token after this deploy: exactly 1 (enforced by the deploy script)"


      - name: Remove ephemeral SSH key
        if: always()
        run: rm -f "${HOME}/.ssh/prod_key"
