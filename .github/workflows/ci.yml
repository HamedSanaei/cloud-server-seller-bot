name: ci

on:
  pull_request:
  push:
    branches: [main]

# One CI run per ref: newer pushes cancel superseded runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Avoid hardlink/permission flakiness of cached virtualenvs between runners.
  UV_LINK_MODE: copy

jobs:
  static:
    name: Lint & types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          cache: "true"
      # --frozen: the lockfile is the single source of truth; the build fails
      # if pyproject.toml and uv.lock drift, keeping every run deterministic.
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (format)
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src
      - name: Pre-commit (secret scanning, etc.)
        run: uv run pre-commit run --all-files
        env:
          GIT_AUTHOR_NAME: "ci"
          GIT_AUTHOR_EMAIL: "ci@ci.ci"
          GIT_COMMITTER_NAME: "ci"
          GIT_COMMITTER_EMAIL: "ci@ci.ci"

  test:
    name: Tests & coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          cache: "true"
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups
      # Deterministic suite: stable file order, JUnit results, and a coverage
      # regression gate one point below the measured baseline (89%).
      - name: Run test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          uv run pytest
          --junitxml=pytest-results.xml
          --cov=src
          --cov-report=xml:coverage.xml
          --cov-report=term
          --cov-fail-under=88
      # M12-003: the migration compatibility gate - rolling-deploy-unsafe
      # schema changes (drops/renames/defaultless NOT NULL on the upgrade
      # path) fail the build unless a reasoned '# compat-override:' is present.
      - name: Migration compatibility gate
        run: uv run python scripts/check_migrations.py
      # M15-007: the provider-branching gate - no domain module may branch on
      # a concrete provider key or import a provider adapter package; a new
      # provider must be addable without touching src/cloud_platform/modules.
      - name: Provider-branching gate
        run: uv run python scripts/check_domain_provider_branching.py
      - name: Validate task backlog
        if: always()
        run: uv run python scripts/validate_tasks.py
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14