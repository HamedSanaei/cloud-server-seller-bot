name: ci

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_LINK_MODE: copy

jobs:
  static:
    name: Lint & types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Ruff (lint)
        run: uv run --no-sync ruff check .
      - name: Ruff (format)
        if: ${{ !cancelled() }}
        run: uv run --no-sync ruff format --check .
      - name: Mypy
        if: ${{ !cancelled() }}
        run: uv run --no-sync mypy src
      - name: Pre-commit (secret scanning, etc.)
        if: ${{ !cancelled() }}
        run: uv run --no-sync pre-commit run --all-files
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@ci.ci
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@ci.ci

  repository-gates:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Migration compatibility
            script: scripts/check_migrations.py
          - name: Provider neutrality
            script: scripts/check_domain_provider_branching.py
          - name: Generated provider contracts
            script: scripts/gen_leaseweb_coverage.py --check
          - name: Task backlog
            script: scripts/validate_tasks.py
          - name: Generated-artifact hygiene
            script: scripts/check_generated_artifacts.py
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Run repository gate
        env:
          GATE_SCRIPT: ${{ matrix.script }}
        run: |
          read -r -a gate_args <<< "$GATE_SCRIPT"
          uv run --no-sync python "${gate_args[@]}"

  test:
    name: Tests & coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Unit migration regressions need real PostgreSQL, not merely a URL.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cloud
          POSTGRES_PASSWORD: cloud
          POSTGRES_DB: cloud
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cloud -d cloud"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://cloud:cloud@localhost:5432/cloud
      CLOUD_PLATFORM_TEST_POSTGRES_URL: postgresql+asyncpg://cloud:cloud@localhost:5432/cloud
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Install PostgreSQL 17 backup and restore clients
        run: |
          sudo apt-get update
          if ! apt-cache show postgresql-client-17 >/dev/null 2>&1; then
            sudo apt-get install --yes postgresql-common
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            sudo apt-get update
          fi
          sudo apt-get install --yes postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/psql --version
      - name: Run test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          mkdir -p .ci-artifacts &&
          uv run --no-sync pytest
          --junitxml=.ci-artifacts/pytest-results.xml
          --cov=src
          --cov-report=xml:.ci-artifacts/coverage.xml
          --cov-report=term
          --cov-fail-under=88
      - name: Verify exact unrounded source coverage
        run: uv run --no-sync python scripts/check_coverage.py .ci-artifacts/coverage.xml
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results
          path: .ci-artifacts/pytest-results.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: .ci-artifacts/coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  migration-smoke:
    name: PostgreSQL migration bridge & contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cloud
          POSTGRES_PASSWORD: cloud
          POSTGRES_DB: cloud
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cloud -d cloud"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://cloud:cloud@localhost:5432/cloud
      CLOUD_PLATFORM_TEST_POSTGRES_URL: postgresql+asyncpg://cloud:cloud@localhost:5432/cloud
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Install PostgreSQL 17 backup and restore clients
        run: |
          sudo apt-get update
          if ! apt-cache show postgresql-client-17 >/dev/null 2>&1; then
            sudo apt-get install --yes postgresql-common
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            sudo apt-get update
          fi
          sudo apt-get install --yes postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/psql --version
      - name: Historical migration bridge (including fresh schema)
        run: uv run --no-sync pytest tests/live/test_migration_bridge.py -q --no-cov
      - name: Migrate a fresh database to head
        if: ${{ !cancelled() }}
        run: uv run --no-sync alembic upgrade head
      - name: Assert migration head and physical schema
        run: |
          uv run --no-sync python -m cloud_platform.db.schema_parity
          head_rev="$(uv run --no-sync alembic heads | awk '{print $1}')"
          current_rev="$(uv run --no-sync alembic current | awk '{print $1}')"
          test -n "$head_rev"
          test "$head_rev" = "$current_rev"
      - name: Live PostgreSQL contracts
        if: ${{ !cancelled() }}
        run: >-
          uv run --no-sync pytest tests/live/test_postgres_*.py
          tests/live/test_financial_payment_outbox.py -q --no-cov

  dependency-review:
    name: Dependency security review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: moderate

  security:
    name: Locked dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Export and audit locked runtime and development dependencies
        run: |
          uv export --locked --all-groups --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/audit-requirements.txt"
          uv tool run --from pip-audit==2.10.1 pip-audit --strict --disable-pip --no-deps --requirement "$RUNNER_TEMP/audit-requirements.txt"

  docker:
    name: Workflow, Docker & deployment validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Validate GitHub workflows
        run: |
          command -v shellcheck >/dev/null || { echo "::error::ShellCheck is required"; exit 1; }
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - uses: docker/setup-buildx-action@v4
      - name: Validate shell and shared production compose
        env:
          PLATFORM_IMAGE: ghcr.io/example/platform:0000000000000000000000000000000000000000
          POSTGRES_PASSWORD: ci-validation-only # pragma: allowlist secret
        run: |
          for script in scripts/deploy-production.sh docker-entrypoint.sh; do
            bash -n "$script"
          done
          PLATFORM_NETWORK=cloud-platform-production-bridge docker compose -f deploy/production/docker-compose.yml config --quiet
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: platform:ci
          build-args: RELEASE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Exercise actual image entrypoint
        run: |
          docker run --rm platform:ci migrate --help
          docker run --rm platform:ci python -c 'import cloud_platform.api.app'
      - name: Isolated health probes fail closed without live service evidence
        run: |
          set -euo pipefail
          probe_log="$(mktemp)"
          trap 'rm -f -- "$probe_log"' EXIT
          for service in api worker bot; do
            case "$service" in
              api) probe=core/http_health.py ;;
              worker) probe=worker/health.py ;;
              bot) probe=bot/health.py ;;
            esac
            set +e
            docker run --rm platform:ci python -I -S "/app/src/cloud_platform/$probe" >"$probe_log" 2>&1
            rc=$?
            set -e
            [ "$rc" = 1 ] || { echo "::error::$service probe must reject absent service evidence"; exit 1; }
            if grep -Eq 'Traceback|ModuleNotFoundError|ImportError' "$probe_log"; then
              echo "::error::$service probe crashed instead of reporting missing health evidence"
              exit 1
            fi
          done

  required:
    name: Required CI checks
    if: always()
    needs: [static, repository-gates, test, migration-smoke, dependency-review, security, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable gate
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, item in results.items()
                    if item['result'] != 'success'
                    and not (name == 'dependency-review' and os.environ['EVENT'] == 'push'
                             and item['result'] == 'skipped')]
          if failed:
              raise SystemExit('Required gates failed or skipped: ' + ', '.join(failed))
          PY
