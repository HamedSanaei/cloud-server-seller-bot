# Pre-commit hooks for cloud-server-platform
# Install with: uv run pre-commit install
# Run manually: uv run pre-commit run --all-files

repos:
  # Ruff: Fast Python linter and formatter
  # Keep the pin in lockstep with the ruff version in pyproject.toml's dev
  # dependencies so `uv run ruff check .` and the pre-commit hook enforce the
  # SAME rule set (one coherent quality policy).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # MyPy: Static type checker
  # This is deliberately a LOCAL hook running mypy in the project's own
  # uv.lock-backed environment, NOT a mirrors-mypy hook with its own
  # `additional_dependencies` list. A range-based second dependency set is an
  # independently resolved universe: it drifts from the lockfile and reports
  # findings (generic-inference differences in SQLAlchemy/pydantic) that the
  # locked environment does not have, so the hook and the CI gate could
  # disagree while both claim to enforce "mypy on src".
  #
  # Invariants:
  #   * the lockfile (uv.lock) is the single source of truth for this project,
  #     including mypy and the libraries it introspects;
  #   * `--frozen` refuses to silently re-resolve if pyproject.toml and
  #     uv.lock drift apart;
  #   * the checked scope is exactly `src`, identical to the repository gate
  #     (`uv run mypy src`); staged filenames are never appended, which would
  #     drag in tests/ and scripts/ and duplicate src/cloud_platform;
  #   * no second dependency list is maintained here.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --frozen mypy
        args: [src]
        language: system
        pass_filenames: false

  # Secret detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: ^(.*\.lock|uv\.lock|.*\.pyc|.*\.png|.*\.jpg|.*\.gif)

  # Check for merge conflicts
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=500"]

  # Ensure pyproject.toml is valid
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-toml

# Configuration for detect-secrets
# Run `uv run detect-secrets scan > .secrets.baseline` to create baseline
