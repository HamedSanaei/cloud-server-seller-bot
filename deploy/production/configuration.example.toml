# Cloud Server Seller — PRODUCTION runtime configuration (EXAMPLE).
#
# Deploy it as:
#   sudo install -d -m 0750 -o root -g 999 /etc/cloud-server-seller
#   sudo install -m 0640 -o root -g 999 \
#       configuration.example.toml /etc/cloud-server-seller/configuration.toml
#   sudo "$EDITOR" /etc/cloud-server-seller/configuration.toml
#
# The containers mount this file read-only at the path below and are told
# where it is with the non-secret bootstrap variable:
#
#   CLOUD_PLATFORM_CONFIG_FILE=/etc/cloud-server-seller/configuration.toml
#
# Precedence of values (highest first):
#   explicit constructor arguments > environment variables > this file > .env
# Production sets NO application secrets in the environment: everything lives
# in this file, which is git-ignored. NEVER commit a real configuration.toml.

[app]
environment = "production"
log_level = "INFO"
default_currency = "EUR"

[database]
# Same credentials as POSTGRES_PASSWORD in the deployment .env file.
# Production inserts the password after "cloud" (percent-encoded as needed).
url = "postgresql+asyncpg://cloud@postgres:5432/cloud"

[redis]
url = "redis://redis:6379/0"

[telegram]
bot_token = "CHANGE_ME"
callback_signing_key = "CHANGE_ME"

# Telegram transient state. `redis` is REQUIRED in production: the bot must
# share callback references, pending confirmations and prompts across restarts
# and replicas. `memory` is refused outside development/test.
# (The release-owned production compose also enforces
# TELEGRAM_SESSIONS_BACKEND=redis, so even an older server file that still
# says `memory` resolves to redis at runtime — but keep this value correct.)
[telegram.sessions]
backend = "redis"
namespace = "cloud-platform:bot"
reference_ttl_seconds = 1800
prompt_ttl_seconds = 900
confirmation_ttl_seconds = 300
replay_ttl_seconds = 1800
admin_chat_id = -1000000000000     # renewals / attention alerts (0 = unset)
support_contact = "@your_support"

# Private business-logger channel. Add the bot to the channel as an
# administrator, then put the channel id here (negative, starts with -100).
# Events reach it through a durable outbox with bounded retries, so a Telegram
# outage can never affect checkout, wallet settlement or provisioning.
[telegram.logger]
enabled = true
chat_id = -1000000000000
log_purchases = true
log_recharges = true
log_payment_failures = true
log_order_failures = true
log_admin_wallet_adjustments = true

# ---------------------------------------------------------------------------
# Providers
#
# `market` places a provider in the storefront: "iran" or "foreign".
# `display_name` is the customer-facing name; internal keys are never shown.
# `enabled = false` hides a configured provider from the store immediately.
# ---------------------------------------------------------------------------

[providers.leaseweb]
enabled = true
market = "foreign"
display_name = "Leaseweb"
api_key = ""  # fill in production; empty means "not configured"
base_url = "https://api.leaseweb.com"
# Locations that may be synced AND sold (allowlist, not a wish list).
locations = ["AMS-01", "FRA-01"]
# Optional OS allowlist; empty = every free OS option the API offers.
os_allowlist = []
order_os_only_free = true
contract_term = "1_MONTH"
billing_cycle = "1_MONTH"

# --- Multiple Leaseweb credential accounts (LEASEWEB-MULTIACCOUNT) ----------
# A Leaseweb API key / Sales Organization only sees a narrow set of locations,
# so the platform can hold SEVERAL keys while customers still see ONE provider
# called "Leaseweb". Locations from every account are merged into the single
# storefront; accounts themselves are never customer-visible.
#
# These keys live ONLY in this server-owned file (mounted read-only into the
# containers). Do not put them in deploy.env, the release compose or any CI
# variable — the deployment workflow must never carry provider credentials.
#
# Each account discovers its own eligible locations from live, read-only
# provider responses: there is no location mapping to maintain. Adding a key
# means appending a block and restarting the services.
#
#   state = "active"   -> discovery + new orders + manages what it owns
#           "draining" -> no new orders; existing servers stay manageable
#           "disabled" -> not used at all (operator intervention required)
#
# ONE key may see SEVERAL locations, and several keys may each see their own:
# locations are therefore never configured per account. Every account discovers
# its own eligible locations from live read-only provider responses, and ALL of
# them are merged into the single "Leaseweb" storefront (one card per product,
# with the locations listed as availability options).
#
# With no accounts configured, the single `api_key` above keeps working and is
# treated as account id "default" — which is where servers and orders created
# before multi-account support are routed.
#
# Preferred form — the table key IS the account id, so nothing is repeated and
# nothing can drift out of sync. `label` is optional operator-facing text shown
# by `leaseweb accounts doctor` and is never visible to customers.
#
# [providers.leaseweb.accounts.sales-org-north]
# api_key = "CHANGE_ME"
# enabled = true
# label = "Frankfurt Sales Organization"
# priority = 100
#
# [providers.leaseweb.accounts.sales-org-uk]
# api_key = "CHANGE_ME"
# enabled = true
# label = "UK Sales Organization"
# priority = 200
#
# Equivalent list form (the id is a field):
#
# [[providers.leaseweb.accounts]]
# id = "sales-org-north"
# enabled = true
# api_key = "CHANGE_ME"
# priority = 100

[providers.arvancloud]
# Iranian market provider. Add another Iranian provider later by adding a
# section here — the storefront reads the market map, never a provider name.
enabled = true
market = "iran"
display_name = "ArvanCloud"
api_key = ""  # fill in production; empty means "not configured"
base_url = "https://napi.arvancloud.ir/ecc/v1"
region = "CHANGE_ME"

[providers.hetzner]
enabled = false
market = "foreign"
display_name = "Hetzner"
api_token = "CHANGE_ME"
base_url = "https://api.hetzner.cloud/v1"

[payments.zarinpal]
enabled = true
merchant_id = "CHANGE_ME"  # pragma: allowlist secret
base_url = "https://api.zarinpal.com/pg/v4/payment"
sandbox = false
callback_url = "https://your-domain.example/api/v1/payments/zarinpal/callback"

[payments.tetraminator]
# Second Iranian gateway (Toman). Disabled until the operator opts in by
# setting enabled = true AND a real api_key below. Amounts are integer
# Toman; the documented minimum invoice is 50,000 Toman.
enabled = false
api_key = "CHANGE_ME"  # pragma: allowlist secret
base_url = "https://api.tetraminator.com/v1"
callback_url = "https://your-domain.example/webhooks/payments/tetraminator"
timeout_seconds = 30

# Currency / FX resolution (platform-level, provider-neutral). The first live
# source is AbanTether's PUBLIC ticker (read-only, no secret). Production
# requires HTTPS for the ticker base URL. Reverse-proxy note: the API needs
# no inbound FX connectivity (outbound HTTPS to api.abantether.com only);
# the Tetraminator callback URL above is the one that must be publicly
# reachable (see docs/payments/TETRAMINATOR.md).
[fx]
enabled = true
provider = "abantether"
default_display_currency = "IRT"
quote_ttl_seconds = 60
max_stale_seconds = 300
charge_max_stale_seconds = 30
request_timeout_seconds = 5
allow_usdt_proxy_for_display = true
allow_usdt_proxy_for_settlement = false

[fx.abantether]
base_url = "https://api.abantether.com"
eur_symbol = "EUR"
usd_proxy_symbol = "USDT"

[security]
# 32-byte url-safe base64 keys. Generate with:
#   python -c "import base64; from cloud_platform.core.secrets import MasterKey; print(base64.urlsafe_b64encode(MasterKey.generate().material).decode())"
provider_credential_encryption_key = "CHANGE_ME"
backup_encryption_key = "CHANGE_ME"

[billing]
price_book_name = "retail-eur"
customer_billing_quantum_seconds = 3600
low_balance_threshold_minor = 5000
low_balance_grace_hours = 24

[backup]
output_dir = "/var/backups/cloud-server-seller"
retention_days = 14

[observability]
otel_exporter_endpoint = ""        # e.g. http://otel-collector:4317
otel_sample_ratio = 1.0

[api]
allow_header_identity = false      # dev/test only; never in production
rate_limit_per_minute = 240

# What a paying customer may do from Telegram ("My servers").
# Capability groups combine with what the provider adapter actually supports
# and what the server's state allows; a group set to false simply hides its
# buttons. Destructive actions stay behind a one-time confirmation whatever
# the flags say.
[features.server_management]
enabled = true                     # the whole section
manager = true                     # details, refresh, rename
power = true                       # start / stop / reboot
console = true                     # temporary console link
traffic = true                     # data-traffic usage
snapshots = true                   # list / create / restore / delete
reinstall = true                   # OS reinstall (destructive)
password_reset = true              # OS password reset (destructive)  # pragma: allowlist secret
iso = false                        # attach/detach ISO (advanced, off by default)
ip_management = true               # list IPs, reverse DNS, null route
monitoring = true                  # monitoring status + enable
billing = true                     # renew-now + auto-renew toggle (local only)
page_size = 5                      # servers per Telegram page
traffic_window_days = 30           # trailing window for the traffic screen
confirmation_ttl_seconds = 900     # lifetime of a one-time confirmation

# Customer billing lifecycle (separate from provider infrastructure state).
# Never makes a provider API call; the renewal price always comes from the
# local commercial price on the service.
[commerce.renewal]
enabled = true
charge_before_expiry_hours = 72
warning_before_expiry_hours = [168, 72, 24]
grace_period_hours = 48
auto_renew_default = true

[commerce.suspension]
stop_server_after_grace = false
