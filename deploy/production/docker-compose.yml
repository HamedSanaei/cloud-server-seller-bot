# Production deployment for the cloud platform.
#
# Configuration model (one source of truth):
#
#   * ALL application configuration and secrets live in a server-owned TOML
#     file (default /etc/cloud-server-seller/configuration.toml), mounted
#     read-only into every container. It is NEVER committed, uploaded from
#     the repository, or overwritten by a deployment. Bootstrap it once from
#     the repository's canonical template `configuration.example.toml`, which
#     documents every supported key (see docs/operations/PRODUCTION_DEPLOY.md).
#     There is deliberately no second, production-flavoured example: this
#     compose file consumes ONLY the server-owned real config.
#   * The only environment variable the platform needs is the NON-SECRET
#     bootstrap path CLOUD_PLATFORM_CONFIG_FILE.
#   * The deployment env file (server-side, e.g. /opt/cloud-server-seller/
#     deploy.env, mode 600) holds infrastructure values only: the immutable
#     image tag, the PostgreSQL password (which also appears in the TOML
#     database.url for the same database), the API port, and optionally
#     CONFIGURATION_PATH. Automated deploys update ONLY PLATFORM_IMAGE there.
#
#   Server layout:
#     /opt/cloud-server-seller/docker-compose.yml   (RELEASE-OWNED: promoted
#       from the tested commit's candidate on every successful deploy; never
#       edited by hand for normal deploys)
#     /opt/cloud-server-seller/deploy.env           (SERVER-OWNED: PLATFORM_IMAGE + secrets)
#     /etc/cloud-server-seller/configuration.toml   (SERVER-OWNED: application config)
#
#   docker compose --env-file deploy.env -f docker-compose.yml up -d
#   docker compose --env-file deploy.env -f docker-compose.yml --profile backup run --rm backup
#
# The migrate job (alembic upgrade head) completes BEFORE api/worker/bot
# start, so the first deploy into an empty database and every later deploy
# run the same sequence.

name: cloud-platform-production

x-platform: &platform
  image: ${PLATFORM_IMAGE:?set PLATFORM_IMAGE in deploy.env (ghcr.io/<org>/<repo>:<full-sha>)}
  # Reap orphaned children (including completed Docker health probes). Without
  # an init process they accumulate under PID 1 until pids_limit blocks exec.
  init: true
  environment:
    # Bootstrap only: names the file, contains no secret.
    CLOUD_PLATFORM_CONFIG_FILE: /etc/cloud-server-seller/configuration.toml
    # Production topology invariant (NON-SECRET): Telegram transient state
    # must live in shared Redis. Environment beats configuration.toml by
    # documented precedence, so this safely overrides a stale historical
    # `[telegram.sessions] backend = "memory"` without touching the
    # server-owned file. Api, worker, bot and migrate all resolve redis.
    TELEGRAM_SESSIONS_BACKEND: redis
  volumes:
    # Server-owned configuration: never committed, never overwritten by a
    # deploy. CONFIGURATION_PATH may point elsewhere; the default is the
    # documented server path.
    - &platform-config ${CONFIGURATION_PATH:-/etc/cloud-server-seller/configuration.toml}:/etc/cloud-server-seller/configuration.toml:ro
  restart: unless-stopped
  stop_grace_period: 45s
  mem_limit: 1g
  cpus: 1.0
  pids_limit: 256
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# This server-owned directory is excluded from Git and image build contexts.
# An empty directory keeps guest management disabled; installing a pinned config
# is an explicit operator action. Workers/migration/backup never receive SSH keys.
x-management-ssh: &management-ssh
  type: bind
  source: ${MANAGEMENT_SSH_DIR:-./management-ssh}
  target: /etc/cloud-platform/management-ssh
  read_only: true
  bind:
    create_host_path: true

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: cloud
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloud -d cloud"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # no published ports: only the platform services reach the database

  # Telegram transient state (callback references, pending confirmations,
  # prompts). Never published to the host: only the platform services on this
  # private compose network can reach it. AOF persistence keeps a one-time
  # destructive confirmation alive across an ordinary Redis restart; if the
  # data is lost anyway the platform fails CLOSED (it refuses mutations rather
  # than guessing), so data loss can never authorise an operation.
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    <<: *platform
    command: ["migrate"]
    # One-shot job: the image HTTP healthcheck (port 8000) does not apply.
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *platform
    command: ["api"]
    volumes:
      - *platform-config
      - *management-ssh
    # The image HEALTHCHECK (GET /health/live on :8000) is kept exactly here:
    # api is the only service that serves HTTP.
    ports:
      - "${API_BIND_ADDRESS:-0.0.0.0}:${API_PORT:-8000}:8000"
    networks:
      default:
      platform-bridge:
        aliases: [cloud-platform-api]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *platform
    command: ["worker"]
    # ARQ's expiring Redis sentinel proves the event loop actually ran.
    healthcheck:
      test: ["CMD", "python", "-m", "cloud_platform.worker.health"]
      interval: 15s
      timeout: 10s
      start_period: 45s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Telegram storefront + operator notifications. Long polling, so no ports.
  #
  # REPLICAS = 1. Telegram long polling is a single-consumer transport: two
  # processes polling the SAME bot token contend for updates and `getUpdates`
  # conflicts. Sharing Redis makes bot-managed state safe across a RESTART, a
  # container replacement and a rolling deploy - it does NOT make two pollers
  # safe. Scale the api/worker instead, or move to a webhook first.
  bot:
    <<: *platform
    command: ["bot"]
    volumes:
      - *platform-config
      - *management-ssh
    # Local heartbeat is refreshed only by successful Telegram long polls.
    # This probe never calls getUpdates and never consumes a customer update.
    healthcheck:
      test: ["CMD", "python", "-m", "cloud_platform.bot.health"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 3
    deploy:
      replicas: 1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # One encrypted pg_dump per run; run explicitly:
  #   docker compose --profile backup run --rm backup
  volume-init:
    image: ${PLATFORM_IMAGE:?set PLATFORM_IMAGE in deploy.env (ghcr.io/<org>/<repo>:<full-sha>)}
    user: root
    command: ["/bin/sh", "-c", "chown -R $$(id -u app):$$(id -g app) /backups"]
    volumes:
      - backups:/backups
    restart: "no"
    healthcheck:
      disable: true
    profiles: ["backup"]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 32

  backup:
    <<: *platform
    image: ${PLATFORM_IMAGE:?set PLATFORM_IMAGE in deploy.env (ghcr.io/<org>/<repo>:<full-sha>)}
    command: ["backup"]
    # One-shot job: the image HTTP healthcheck (port 8000) does not apply.
    healthcheck:
      disable: true
    environment:
      CLOUD_PLATFORM_CONFIG_FILE: /etc/cloud-server-seller/configuration.toml
      BACKUP_OUTPUT_DIR: /backups
    volumes:
      - ${CONFIGURATION_PATH:-/etc/cloud-server-seller/configuration.toml}:/etc/cloud-server-seller/configuration.toml:ro
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully
    restart: "no"
    profiles: ["backup"]

volumes:
  pgdata:
  redisdata:
  backups:

networks:
  platform-bridge:
    name: ${PLATFORM_NETWORK:-cloud-platform-production-bridge}
