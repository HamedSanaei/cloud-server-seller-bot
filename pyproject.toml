[project]
name = "cloud-server-platform"
version = "0.1.0"
description = "Telegram-first multi-provider cloud server platform"
requires-python = ">=3.13"
dependencies = [
  "aiogram>=3.20,<4",
  "alembic>=1.16,<2",
  "arq>=0.26,<1",
  "asyncpg>=0.30,<1",
  "cryptography>=44,<46",
  "psycopg2-binary>=2.9,<3",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-json-logger>=3.3,<4",
  "redis>=5,<6",
  "sqlalchemy[asyncio]>=2.0.40,<3",
  "structlog>=25,<26",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "detect-secrets>=1.5.0",
  "mypy>=1.17,<2",
  "pre-commit>=4.6.2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "pyyaml>=6.0.3",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_platform"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["cloud_platform"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
