- id: M04-005
  milestone: M04
  title: Implement provider pricing ingestion
  priority: P0
  status: done
  owner_hint: supervisor
  depends_on:
  - M04-003
  acceptance:
  - Location-aware provider prices persist without hard-coding.
  evidence:
  - '2026-08-23: Implemented provider pricing ingestion in modules/catalog. Domain: ProviderPriceEntry (per-location hourly/monthly
    as Decimal, >=1 price required, negatives rejected), PlanPricing (specs + tuple of location entries), hourly_minor() -
    provider hourly price is authoritative, else monthly/720 with ROUND_HALF_UP - and to_minor_units() (Decimal-only, no float
    anywhere). CatalogEntrySpec + CatalogRepository port. SqlAlchemyCatalogRepository upserts on the existing uq_catalog_provider_plan_location
    unique constraint; providers resolved by name and created with deterministic uuid5 when missing (fixes the old string-id
    Provider bug). PricingIngestionService persists one catalog row per (provider, plan, location). Hetzner syncer _upsert_plans
    rewritten: parses the real per-location API shape (location + hourly.gross + monthly.gross) into PlanPricing and routes
    through the ingestion service - removing the float monthly/720 truncation (5.83/month used to store 0 cents/hour, now
    1) and the hardcoded ''global'' location / first-price-only logic. 34 tests: Decimal-vs-float rounding proof (2.675 ->
    268), hourly precedence, monthly derivation, validation, service forwarding, repository create/update/provider-creation
    paths, and updated syncer test asserting per-location rows with correct minor units; full suite 434 passed.'
- id: M04-006
  milestone: M04
  title: Implement catalog sync job with lock
  priority: P0
  status: done
  owner_hint: H2
  depends_on:
  - M04-002
  - M04-003
  - M04-004
  acceptance:
  - Concurrent syncs cannot corrupt catalog.
  evidence:
  - '2026-08-23: Implemented the catalog sync job with lock (M04-006). Domain (modules/catalog/domain.py): CatalogSyncLock
    protocol (guard() async context manager yielding whether the lock was won), CatalogSyncStep (named async step), CatalogSyncStepReport
    and CatalogSyncRunReport, and CatalogSyncJob which runs all steps exclusively under the lock: the loser of the race skips
    the entire run (no partial writes), a step that raises is recorded as a failed step report and the run continues (next
    scheduled run retries), and the lock is always released. Adapter (modules/catalog/repository.py): PostgresAdvisoryCatalogSyncLock
    uses pg_try_advisory_lock/pg_advisory_unlock with a stable uuid5-derived 64-bit key; acquire and release happen on the
    SAME session held open for the whole guarded interval (Postgres binds session advisory locks to the acquiring backend),
    with session close as the crash backstop. Wiring (providers/hetzner/sync.py): build_catalog_sync_job(syncer, lock) adapts
    the existing paginated sync_locations/sync_plans/sync_images into three domain steps under one lock hold. 11 tests: steps
    run in order under the lock with release, held lock skips the entire run with zero writes, failing step recorded while
    the run continues, lock released when every step fails, empty steps rejected, advisory lock acquire-true unlocks on the
    same session (statement order + identity asserted), acquire-false never unlocks, unlock still runs when guarded code raises,
    the acceptance proof (two jobs racing through an advisory-style lock: exactly one ran, the other skipped, every step executed
    exactly once, catalog left in a consistent complete state), and the builder wires all three steps reusing one lock hold.
    Full suite 707 passed.'
