- id: M11-007
  milestone: M11
  title: Automate PostgreSQL backups
  priority: P0
  status: done
  owner_hint: H1
  depends_on:
  - M01-001
  acceptance:
  - Encrypted backup job + retention.
  evidence:
  - '2026-08-24: Automated encrypted PostgreSQL backups with retention (M11-007) in a new backup package. PostgresBackupJob.run():
    pg_dump (plain format, --no-password --no-owner --no-privileges) via an injectable async runner (default runs pg_dump
    in a thread so the loop stays responsive) -> Fernet-encrypts the dump under the configured 32-byte MasterKey (reusing
    core.secrets; FernetSecretBox gained encrypt_bytes/decrypt_bytes) -> writes cloud-backup-YYYYMMDD-HHMMSS.dump.enc into
    the output directory -> prunes backups older than retention_days. Security: the DSN carries the DB password and never
    reaches logs, exceptions or the CLI summary (redact_dsn masks the password, runner stderr is scrubbed of the DSN and raw
    password before reporting, the argv is never logged); the plaintext dump exists only in memory; retention deletes ONLY
    files matching the platform''s own backup name pattern whose embedded timestamp parses - foreign files and unparseable
    names are never touched. Config: Settings gained backup_output_dir, backup_retention_days (>=1), backup_encryption_key
    (env-provided 32-byte url-safe base64, never hardcoded; missing/invalid key -> BackupError); build_backup_config translates
    the postgresql+asyncpg DSN to the postgres scheme pg_dump accepts. Run one backup with python -m cloud_platform.backup
    (one-line log-safe summary). Each run is timed under the postgres_backup job metric. 18 tests: pg_dump command shape,
    DSN redaction (masked, unchanged without password), stderr scrubbing, dump encrypted at rest (file != plaintext; round-trip
    decrypts with the same key), runner receives the command, failed dump raises a redacted BackupError (password absent,
    detail kept, no file written), empty dump rejected, runner exception reported without argv, retention prunes only expired
    own backups (30d and 15d with a 14d window deleted; 1d, foreign file, and unparseable-name file kept), no deletions when
    all fresh, config validation (empty dsn, retention 0), asyncpg DSN translation, missing/invalid/short key rejected, and
    the job metric bump (delta-based). Full suite 837 passed.'
- id: M11-008
  milestone: M11
  title: Document/test restore drill
  priority: P0
  status: done
  owner_hint: supervisor
  depends_on:
  - M11-007
  acceptance:
  - Restore into clean environment verified.
  evidence:
  - '2026-08-24: Documented and tested the restore drill (M11-008); acceptance ''Restore into clean environment verified''
    holds. NEW restore path in src/cloud_platform/backup/job.py: parse_backup_filename (the UTC timestamp embedded in the
    platform''s own filename pattern; ValueError on foreign names), list_backups (only platform-named files, newest first;
    a missing directory is empty, not an error), RestoreError, build_pg_restore_command (psql --single-transaction --quiet
    <dsn> - the dump is plain SQL from pg_dump --format=plain, so the restore is all-or-nothing) and PostgresRestoreJob(dsn,
    key, output_dir, runner): select_backup_file (an explicit filename must match a platform backup, otherwise RestoreError
    listing the known files; otherwise the newest), run() = resolve file -> read + decrypt with the configured 32-byte key
    (SecretBoxError -> RestoreError BEFORE anything reaches the database) -> empty-dump check -> stream the SQL to the injectable
    psql runner (non-zero exit -> RestoreError with the STDERR scrubbed by the M11-007 _scrub: no DSN, no password) -> logs
    a safe completion line. The backup file is never modified or deleted by a restore, so a failed restore can be retried
    from the same file. CLI: python -m cloud_platform.backup gained --restore [FILENAME] (const ''latest'' selects the newest)
    and --target-dsn (restore into a clean environment; defaults to the configured database URL with the +asyncpg driver suffix
    stripped); success prints ''restore ok: <filename>'', failure prints a scrubbed ''restore failed: <reason>'' and exits
    1. Documentation: docs/operations/RUNBOOK.md gained a ''Restore drill'' section - the three-step procedure (clean PostgreSQL
    instance, run the restore command with --target-dsn, verify table counts/spot-check queries), the four verified safety
    properties (wrong key aborts before the DB via the Fernet MAC, only platform-named files are selectable, the backup file
    is untouched by a failed restore, psql error output is scrubbed), the rollback (drop/recreate the clean DB or restore
    the previous file; production is never the drill target) and the drill cadence (monthly + after any key/path/command change).
    TESTS: tests/unit/test_restore_drill.py (11 tests) verifies the whole drill end to end with fakes - THE clean-environment
    round trip: a backup produced by the real PostgresBackupJob (fake pg_dump emitting the dump bytes) is restored from a
    fresh directory into a fake psql sink and the restored SQL is byte-identical to the original dump and delivered exactly
    once; latest picks the newest of two backups (the older one is never restored); a named backup restores exactly that file;
    a missing named backup is rejected; an empty directory is rejected; a WRONG key (the file was encrypted with a different
    MasterKey) aborts with ''decryption failed'' and NOTHING reaches the psql sink; a corrupted file (one byte flipped) aborts
    the same way; a psql failure (exit 1 with the DSN + password echoed in stderr) raises a RestoreError whose message contains
    neither the DSN nor the password (scrubbed to ***) and the backup file is byte-identical afterwards; the psql command
    uses --single-transaction; config validation (empty DSN rejected) and foreign/unparseable files in the backup dir are
    invisible to selection. The existing M11-007 backup suite still passes unchanged. Full suite 1264 passed.'
- id: M11-009
  milestone: M11
  title: Add chaos tests for provider timeouts
  priority: P1
  status: done
  owner_hint: H2
  depends_on:
  - M07-003
  - M07-008
  acceptance:
  - No double create/charge after injected timeout.
  evidence:
  - '2026-08-24: Added chaos tests for provider timeouts (M11-009); acceptance ''No double create/charge after injected timeout''
    holds. NEW tests/unit/test_provider_timeout_chaos.py (5 tests) injects timeouts at the HTTP layer of the REAL HetznerCloudProvider
    over a chaos fake transport (ChaosHetznerAPI) that models a participating provider: it deduplicates POST /servers on the
    platform-operation label (same operation key returns the SAME resource) and supports three chaos knobs - timeout AFTER
    the mutation landed (the ambiguous lost-response window), timeout BEFORE anything landed (clean retry), and delete-then-timeout.
    SCENARIOS: (1) crash during create: the worker dies with the op IN_FLIGHT after the provider applied the create; CreateTimeoutReconciler
    re-resolves with the SAME idempotency key, the provider deduplicates, and assertions pin exactly one physical server despite
    two POSTs, op COMPLETED with correlation to that server, and the server row pointing at it - no duplicate create. (2)
    requeued timeout then retry: first attempt times out before landing -> REQUEUED with attempts=1 and nothing at the provider;
    second run creates exactly ONE server, op COMPLETED, attempts=2. (3) same-key guarantee: both attempts carry the identical
    platform-operation label (OP_KEY[:63]) so provider-side dedup is possible - no new key is ever minted. (4) delete ambiguity:
    DELETE applied then timed out; the saga''s resend hits 404 which the adapter maps to success - no double-delete error,
    resource stays gone. (5) charge: FinalChargeService with an in-memory ledger whose post_entry raises TimeoutError AFTER
    committing (lost ack); the crash-replay finds the deterministic final:{server_id} entry by key and moves nothing - debits==1,
    entries==1, wallet debited exactly once (asserted balance), replay detected. Also exercised incidentally: httpx.ReadTimeout
    -> ProviderUnavailable mapping through the real adapter, image selection through GET /images (os_flavor mapping), and
    the wallet-ledger duplicate-key rejection. No product code changes required - the existing idempotency machinery held
    under all injected failures. Full gate: ruff format/check clean, mypy clean (106 files), 1525 passed 11 skipped, provider-branching
    gate clean.'
