    validates OpenSSH public keys (supported types ssh-ed25519, ssh-rsa, ecdsa-nistp256/384/521; strict ''<type> <base64>
    [comment]'' parse with base64 validation and 64 KiB blob cap) and computes OpenSSH-style SHA256 fingerprints from PUBLIC
    material only (known-answer vector pinned in tests); SshKey entity normalizes name/key on construction. service.py SshKeyService
    enforces ownership IN THE APPLICATION LAYER on every operation: register/list/delete all take actor_user_id vs owner_user_id
    - registering for another user is refused; another user''s key by id reads as NOT FOUND (no existence leak) and cannot
    be deleted; listing another user''s keys is denied. Registration dedupes per user (same name AND same fingerprint both
    rejected via DuplicateSshKeyError), caps quota (20 default, injectable), and audits through the AuditTrail chokepoint
    (ActorType.USER + actor_id, actions sshkey.registered / sshkey.deleted). repository.py SqlAlchemySshKeyRepository maps
    to a new ssh_keys table (migration 0022: user FK CASCADE, unique (user_id,name) + unique (user_id,fingerprint), ix_ssh_keys_user_id;
