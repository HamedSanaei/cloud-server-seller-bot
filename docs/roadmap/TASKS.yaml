    the deploy path, post-deploy verification via alembic current; (3) ROLLBACK - decision rule ''code first, schema only
    when safe'': code rollback = point PLATFORM_IMAGE at the previous immutable SHA tag and compose up -d (safe because the
    gate guarantees old code works on the new schema; in-flight operations reconcile via idempotency keys), schema rollback
    = rare, manual, additive-only, documented in the incident log, and rollback NEVER rewrites ledger/wallet rows, deletes
    accrual periods, or touches provider resources (a provider operation already applied is reconciled, not undone), if the
