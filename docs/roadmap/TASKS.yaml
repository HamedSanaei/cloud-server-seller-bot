- id: M07-003
  milestone: M07
  title: Implement create timeout reconciliation
  priority: P0
  status: done
  owner_hint: H2
  depends_on:
  - M07-002
  acceptance:
  - Ambiguous timeout cannot create duplicate server.
  evidence:
  - '2026-08-23: Implemented create timeout reconciliation (M07-003). CreateTimeoutReconciler in modules/operations/service.py
    resolves the ambiguous window left by the provisioning worker, with two hard safety rules that make a duplicate server
    impossible: (1) it NEVER issues a new idempotency key - a stale IN_FLIGHT create operation is re-resolved by calling provider.create_server
    again with the SAME operation key, so the provider deduplicates and returns the same resource (or the already-recorded
    provider server id is verified); (2) it NEVER deletes a provider resource - any state it cannot resolve safely is contained
    to MANUAL_REVIEW (server.contain() remembers the prior state) for a human. It scans three candidate classes with snapshotted
    lists (one consistent view per round): (a) IN_FLIGHT create operations past in_flight_timeout (default 15m, injectable
    clock) - same-key re-send: success completes the operation with the correlation and advances the row to PROVISIONING with
    audit server.provisioning_recovered; retryable error re-queues to PENDING (audit server.provisioning_requeued); permanent
    error fails the operation, moves the server to ERROR, releases the create hold and audits server.provisioning_failed;
    a server that left the create window (e.g. DELETING) or whose row is gone fails the op and refunds the hold. (b) REQUESTED
    servers whose operation row is missing (crash before the worker created it) - the operation is recreated with the deterministic
    key as PENDING (it has never called the provider), so the worker can claim it safely. (c) PROVISIONING servers past provisioning_timeout
    (default 1h) whose operation is COMPLETED: provider.get_server(provider_server_id) - resource exists but not finished
    -> MANUAL_REVIEW (uncertain, human decides); resource vanished -> server ERROR + hold release + audit server.provisioning_lost;
    provider status-check error -> LEFT_UNCHANGED (inconclusive, retry next round, never assumed gone); missing/mismatched
    operation -> MANUAL_REVIEW. Shared plumbing extracted: server_operation_key() and build_create_request() are now module-level
    and used by both worker and reconciler (deterministic request so provider dedup holds); ports extended with OperationRepository.get_by_key
    + list_in_flight and ServerRepository.list_provisioning (SQL implementations). 15 tests: same-key re-resolution (provider
    called with [OP_KEY] only), never-a-new-key across a failed+retried re-send (two sends, one key), fresh in-flight skipped,
    retryable requeue, permanent failure with hold release, missing server row, left-window refund, stuck-with-live-remote
    to review, vanished-remote fail+refund, get-error left unchanged, missing-operation to review, fresh provisioning skipped,
    missing-operation recreation, existing-pending left alone, non-positive timeout rejected. Full suite 582 passed.'
- id: M07-004
  milestone: M07
  title: Implement provider action waiter strategy
  priority: P1
  status: done
  owner_hint: H1
  depends_on:
  - M07-002
  - M04-009
  acceptance:
  - Polls with bounded backoff and rate-limit awareness.
  evidence:
  - '2026-08-24: Implemented the provider action waiter strategy (M07-004) in a new framework-agnostic module src/cloud_platform/providers/waiter.py.
    ActionWaiter.wait_for(probe) polls a provider action until terminal with: (1) bounded backoff - polls start at base_delay_seconds
    (default 2s) and multiply by multiplier (default 2) per pending observation, clamped at max_delay_seconds (default 30s),
    with the whole wait bounded by max_wait_seconds (default 600s); (2) rate-limit awareness - every individual poll runs
    through a RetryExecutor (M04-009) so a 429 carrying a reset epoch waits out the reset window (clamped to the delay cap)
    and 5xx/unavailability is retried with bounded exponential backoff WITHIN the poll, so transient provider hiccups do not
    burn the poll budget; (3) timeout is not failure - exceeding the deadline returns WaitResult(TIMEOUT) so the caller keeps
    watching via the normal reconciliation path instead of failing a resource that may still complete; (4) permanent errors
    (bad credentials, unknown resource) propagate so the caller can contain them. WaitPolicy validates all bounds. Sleep,
    clock, and the per-poll retry executor are injectable (deterministic tests, no real waiting). Wired into ProvisioningWorker
    as an optional waiter: after create_server succeeds the worker now watches the new provider server (probe normalizes provider
    status via normalize_provider_status: RUNNING -> completed, NOT_FOUND/DELETING -> failed, CREATING/STOPPED/UNKNOWN ->
    pending); a completed watch fast-forwards the server PROVISIONING -> RUNNING and audits server.provisioning_wait_completed;
    a timeout/failure leaves the server in PROVISIONING with server.provisioning_wait_timeout/failed audited so the state
    reconciler (M07-005) keeps ownership; provider errors during the watch are logged, never raised (non-fatal). Without a
    waiter the legacy behavior is unchanged (no extra provider calls). 18 tests: policy validation (4 invalid combos), immediate
    completion (1 poll, 0s), completion after pending polls with exact backoff elapsed, failed probe with detail, deadline
    timeout with exact poll count and elapsed <= max_wait, backoff sequence clamped ([2,4,5,5] with cap 5 and all <= cap),
    transient 502 absorbed within one poll, 429 reset epoch slept out (clock advanced to reset), retry-budget exhaustion propagates,
    permanent 401 propagates immediately, and 4 integration tests (fast-forward to RUNNING with 2 polls + audit, timeout keeps
    PROVISIONING + audit, provider error during watch contained, no-waiter legacy path makes zero get_server calls). Full
    suite 855 passed.'
