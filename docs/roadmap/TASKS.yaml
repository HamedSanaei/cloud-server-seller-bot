- id: M15-001
  milestone: M15
  title: Select first Iranian provider and document API contract
  priority: P0
  status: done
  owner_hint: supervisor
  depends_on:
  - M03-006
  acceptance:
  - Capabilities/gaps/error/rate/pricing model documented.
  evidence:
  - '2026-08-24: Selected ArvanCloud IaaS as the first Iranian provider and documented the full API contract in docs/iranian/PROVIDER_CONTRACT.md
    with a machine-readable OpenAPI snapshot archived at docs/iranian/api/iaas-1.0.json (downloaded from https://www.arvancloud.ir/api-docs/iaas-1.0.json,
    187KB, validated). Selection rationale with alternatives table (Liara, IDCloud/Unico). Documented: (1) transport/auth
    - base URL https://napi.arvancloud.ir/ecc/v1, Machine User key in the Authorization header WITHOUT a Bearer prefix, JSON,
    encrypted secret storage and redaction discipline; (2) capability mapping table for every platform Capability to concrete
    ArvanCloud endpoints (compute/power/rebuild/rescue/snapshot/firewall/network/floating_ip/primary_ip/rdns mapped; BACKUP
    and VOLUME deliberately not advertised in phase 1 with reasons); (3) verified request/response shapes from the spec (CreateServerRequest
    field mapping flavor_id/image_id/key_name/init_script, Plan with price_per_hour/day/month, Region, Quota, ServerDetail);
    (4) async model - mutations return tasks, completion tracked via GET /regions/{r}/servers/inquiry/{task_id}, timeouts
    ambiguous until reconciled, 404-on-delete = success; (5) idempotency design - the provider documents NO Idempotency-Key
    header, so idempotency is enforced platform-side (operation ledger operation_key + correlation-label get-before-create
    + ledger state guard), with a path to adopt a header if one appears; (6) error model - ErrorResponse {message, errors}
    shape mapped exactly to ProviderAuthError/ProviderNotFound/ProviderConflict/ProviderRateLimited/ProviderUnavailable/ProviderError
    with the metric outcome labels, 401 Unauthenticated. documented; (7) rate limiting - no numeric limits documented (open
    item), conservative configurable client-side throttle (default 10 rps) plus Retry-After handling, observed headers captured
    into M11-001 provider metrics; (8) pricing model - provider prices pass through Plan metadata into catalog sync (never
    hard-coded), billing prices owned by the explicit price book, IRR integer minor units, prepaid-package semantics flagged;
    (9) non-negotiable security requirements; (10) M15-002 adapter delivery checklist; (11) six open items to verify with
    live credentials. Sources: https://docs.arvancloud.ir/en/developer-tools/api/api-usage and https://www.arvancloud.ir/api/iaas/1.0.
    Full gate after the doc change: ruff format check, ruff check, mypy (88 files), 837 passed.'
