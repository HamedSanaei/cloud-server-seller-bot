    checks provider.ssh_keys.list_ssh_keys/upload_ssh_key); HetznerCloudProvider gains HetznerSshKeyApi over GET/POST/DELETE
    /ssh_keys with 404-on-delete mapped to idempotent success; ArvanCloud simply has no port (probe returns None). sync_keys_to_provider
    is idempotent by construction: deterministic provider-side names platform-{user8}-{safe-name} are user-scoped so accounts
    never collide; existing remote key with same name+same fingerprint is REUSED (no re-upload - asserted uploads==1 across
    two syncs); remote same-name/different-material raises instead of silently overwriting. Container wires SshKeyService(request-scoped
    factory). TESTS tests/unit/test_ssh_keys.py (25): known fingerprint vector, parse/type/base64/comment cases, entity normalization,
    register happy path + audit fields, cross-user register refusal, duplicate name/material, quota, list/get/delete scoping
    incl. no-existence-leak, delete audited, missing-key not-found, sync upload-then-reuse idempotency, deterministic user-scoped
