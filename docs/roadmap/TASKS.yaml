- id: M11-004
  milestone: M11
  title: Implement dead-letter/manual-review tooling
  priority: P0
  status: done
  owner_hint: H2
  depends_on:
  - M07-005
  acceptance:
  - Failed operations can be inspected/replayed safely.
  evidence:
  - '2026-08-24: Implemented dead-letter / manual-review tooling (M11-004) in modules/operations. Operation gained reopen_for_retry():
    a manual-only FAILED -> PENDING transition deliberately kept OUT of the automated _ALLOWED table (no worker path can ever
    reopen a failed op); it preserves the operation key and the attempts history. OperationRepository gained list_failed(operation_types,
    limit) (SQL: status=failed, optional type filter, updated_at DESC, LIMIT). ServerRepository gained list_manual_review
    (state=manual_review). New OperationToolingService (operations/tooling.py): list_failed (dead-letter inspection), get_operation
    (by key), retry_failed (admin-gated admin:manage_settings, system actor allowed, non-empty reason required) and review_queue
    (every MANUAL_REVIEW server joined with its failed operations). Safe-replay semantics: PENDING returns the operation as
    an idempotent no-op (no save, no audit); COMPLETED is rejected with an explicit double-apply explanation (the provider
    mutation already applied); IN_FLIGHT is rejected (a worker owns it); FAILED reopens to PENDING, is saved, and is audited
    as operation.retry with the actor, reason and attempts-before metadata. The replay is safe because the worker re-sends
    the SAME operation key, so the provider deduplicates the mutation. 17 tests: reopen only from FAILED (PENDING/IN_FLIGHT/COMPLETED
    rejected) with attempts preserved, reopen-then-worker-claim works, non-admin rejected without writes, empty reason rejected,
    unknown key LookupError, failed->pending with save + operation.retry audit (action/resource/reason/attempts_before), system
    actor allowed, pending idempotent no-op, completed never replayed (double-apply), in-flight rejected, list_failed type
    filter + limit, get_operation by key, review queue joins the server with its failed ops (excluding other servers'' ops)
    and empty queue. Full suite 819 passed.'
