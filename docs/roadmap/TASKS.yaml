    gained the same optional progress and emits failed(server, reason) on the lost-provider-resource path and in _fail_intent.
    14 tests: final kinds are final, success delivered exactly once across three attempts (event fields user/server/detail),
    failure delivered exactly once, success and failure are separate dedup kinds, different servers independent, started never
    touches the final log (progress may repeat), the logging notifier logs (caplog), repository first-record commits the row
    with kind value ''success'', a duplicate insert (IntegrityError) rolls back and returns False, non-final kinds are rejected,
    worker without a progress service is unchanged, happy path emits only started (no final yet - the waiter decides), a completed
