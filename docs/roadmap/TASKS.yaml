    call - explicitly never a mutating call as a smoke test - and alert confirmation for 15 minutes), plus the kill-switch
    pointer from RUNBOOK.md. Ends with a copy-per-release deploy checklist. TESTS: tests/unit/test_production_runbook.py (5
    tests) assert the runbook exists and covers all four acceptance areas with the concrete mechanisms (every secret variable
