    the server stays DELETED, the operation is FAILED with the billing gap audited (billing.final_charge_failed) for the manual
    review queue. The operation completes with the correlation (provider_server_id, deleted_at, charged_minor, charge_capped)
    and a server.deleted audit event. Every saga step is individually replay-safe. (3) DeleteWorker.process_pending_deletes
    - the worker path that claims and executes PENDING delete operations (crash recovery + retryable re-queues) with the same
    executor and keys; registered as the arq job process_deletes in worker/settings.py (registry built from settings like
    the container). OperationType.SERVER_DELETE added to the operation ledger domain. 17 tests: happy path (single provider
    delete call, final charge with the deletion timestamp, completed correlation, audit trail), replay of a completed command
    (no provider call, no second charge), not-owner and unknown-server indistinguishability, state gate (PROVISIONING rejected),
    in-flight rejected, failed op surfaces its recorded error, empty idempotency key rejected, 404-on-delete success, retryable
    error re-queues (state DELETING, op PENDING attempts=1, no billing, audited), permanent error (auth) fails the op and
    leaves the server in DELETING for review, absence-wait timeout re-queues with re-verification semantics and no billing,
    no-provider-resource server releases the hold and skips billing (correlation charged=0), missing snapshot fails the op
    but the server stays DELETED with the billing audit, cap-capped charge correlation, and the worker executing a re-queued
