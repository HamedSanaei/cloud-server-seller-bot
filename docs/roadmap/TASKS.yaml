  evidence:
  - '2026-08-24: Implemented the delete-server saga (M07-007) following the acceptance order: delete request -> provider absent
    -> billing final -> deleted. New in src/cloud_platform/modules/operations/service.py: (1) DeleteCommandService.request(user_id,
    server_id, idempotency_key) - application-layer authorization (ownership: foreign or unknown servers are indistinguishable
    via DeleteNotOwnerError; capability: only RUNNING/STOPPED/ERROR/MANUAL_REVIEW may be deleted), ledger-first idempotency
    (a completed intent replays with no provider call, an in-flight one is rejected, a failed one surfaces its recorded error),
    creates the operation (key server-delete:{server_id}:{ik}) and moves the server to DELETE_REQUESTED with a server.delete_requested
    audit event. (2) DeleteOperationExecutor.execute - the saga: transitions DELETE_REQUESTED -> DELETING, calls provider.delete_server
    once per operation with the operation key as the provider IdempotencyKey (a re-send can never double-delete), treats ProviderNotFound
    (404 on delete) as success, re-queues retryable provider errors with the SAME key, then waits for confirmed absence with
    the bounded ActionWaiter (get_server until None) - a timeout re-queues the same operation for re-verification instead
    of failing (404-on-retry resolves the ambiguity, so nothing can double-act). A server that never had a provider resource
    (failed before provisioning) skips the provider step entirely and gets its still-reserved creation hold RELEASED back
    to the wallet (no usage, no charge). Once absence is confirmed the server gets its deletion timestamp and transitions
    to DELETED (freeing quota), and FinalChargeService.charge_final (M06-006) settles the final usage segment - idempotent
