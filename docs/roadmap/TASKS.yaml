    ProviderNotFound, ProviderConflict, UnsupportedGatewayOperation) is raised immediately with no retry; everything else
    - known transient (ProviderRateLimited, ProviderUnavailable), timeouts, connection errors, unknowns - is RETRYABLE and
    bounded by the attempt cap. RetryPolicy (max_attempts, base/max exponential delay, bounded jitter) validated in __post_init__;
    RetryExecutor.execute retries only retryable errors, honors a ProviderRateLimited reset_at_unix window (clamped to max_delay),
    applies exponential backoff with optional deterministic jitter, and propagates the last error on exhaustion. Sleep/clock/rng
    injectable for deterministic tests. Exported via providers package __init__. 18 tests covering classification matrix,
    policy validation, first-try success, retry-then-success, immediate permanent propagation, exhaustion, reset-window delays,
