    margin_rule JSON column inside the immutable server price snapshot, so it requires no schema migration and pre-cap persisted
    rows deserialize as uncapped (rule_from_dict uses .get; round-trip and backward-compat tested). Enforcement: (1) the accrual
    job checks, before settling each period, the wallet''s billed total for the period''s usage month (new AccrualPeriodRepository.month_total
    = SUM(selling_minor) where wallet and period_start >= month_start, plus SqlAlchemyAccrualPeriodRepository implementation)
    - when billed + period charge would exceed the cap, the period is settled as CAPPED: no money moves, no ledger entry,
    no business record, but the watermark advances past it (each period is evaluated exactly once, no audit spam, and a new
    month starts a fresh cap), counted in AccrualRunReport.capped_periods (also in render() and the run audit metadata) and
    audited as a billing.cap_reached SYSTEM event with cap/billed/skipped amounts and month start. (2) The final deletion
    charge applies the same cap at the deletion instant: a leg that would pass the cap is skipped; if the capture leg is capped
    the reserved creation hold is RELEASED (release-{ik} ledger entry) so reserved funds are returned to the user instead
    of being stranded - the platform absorbs the difference; FinalChargeResult gained a capped flag and the final_charge audit
    event carries it. The acceptance invariant - the cap cannot overcharge the configured maximum - is exact: billed + charge
    > cap blocks, billed + charge == cap is allowed (boundary tested). 13 tests: rule round-trip with/without cap, old rows
    without the cap key deserialize uncapped, negative cap rejected, month_start_utc boundaries (first-of-month, last instant,
    rollover, naive-as-UTC), accrual cap (5 due periods with cap=2: exactly 2 posted + 3 capped, watermark advances past capped
    periods, only 2 ledger entries and 2 business records; per-usage-month semantics: periods ending in the new month bill
    under the fresh cap; exact-cap boundary allowed; capped periods audited with correct metadata), final charge cap (capped
    final releases the hold and charges nothing with both legs audited; within-cap charges normally; flat leg capped; no-cap
    behavior unchanged). Full suite 1006 passed.'
- id: M07-001
