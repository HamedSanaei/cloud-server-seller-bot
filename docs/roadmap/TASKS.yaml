- id: M02-004
  milestone: M02
  title: Implement terms acceptance versioning
  priority: P1
  status: done
  owner_hint: H1
  depends_on:
  - M02-001
  acceptance:
  - Provisioning can require latest terms.
  evidence:
  - '2026-08-24: Implemented terms acceptance versioning (M02-004). New immutable TermsVersion aggregate (version int strictly
    increasing, body, summary, effective_at; highest published version = current) with TermsVersionRepository port (get/get_latest/list_all/publish)
    and SqlAlchemyTermsVersionRepository; new terms_versions table (version PK) plus users.terms_version column in migration
    0014 (alembic heads verified: 0014 head). User aggregate gained terms_version and a needs_terms_acceptance(latest) predicate;
    accept_terms now records the accepted version and timestamp (two legacy tests updated). New TermsService (users/terms.py):
    publish (admin-gated admin:manage_settings, system actor allowed, version = latest+1, body stripped, audited terms.publish),
    accept (idempotent: no-op when already current or nothing published; persists via new UserRepository.update_terms; audited
    terms.accept; unknown user raises LookupError), user_requires_acceptance, and require_latest - the provisioning gate that
    raises TermsAcceptanceRequiredError for never-accepted/stale users and passes through when no terms are published (nothing
    to accept). CreateServerService gained an optional TermsGate port (require_latest(user) protocol defined in compute/service.py
    so the compute module depends on a port, not the users service) wired as step 1.5: after the user-active check and BEFORE
    any catalog work, so stale terms block provisioning with a distinct TermsAcceptanceRequiredError; without a wired gate
    the legacy behavior is unchanged. 20 new tests: 6 acceptance-predicate cases (nothing published, never accepted, stale,
    current, future version does not block), publish (first version is 1 with stripped body + audit, versions increment 1,2
    -> 3, non-admin rejected with no audit/no publish), accept (records current version + persists + audit, idempotent when
    current with no write, no-op without published terms, unknown user LookupError), require_latest (raises for never-accepted
    with ''never'' message, raises for stale with ''accepted terms 1'', passes when current, passes when nothing published),
    and 3 provisioning-gate integration tests (stale terms raise TermsAcceptanceRequiredError and the catalog is never consulted
    - gate precedes all other checks; current terms proceed past the gate to the catalog; no wired gate never blocks). Full
    suite 900 passed.'
