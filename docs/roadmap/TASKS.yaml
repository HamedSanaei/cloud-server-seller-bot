- id: M15-004
  milestone: M15
  title: Implement provider-specific reconciliation
  priority: P0
  status: done
  owner_hint: H1
  depends_on:
  - M15-002
  acceptance:
  - Ambiguous mutations handled safely.
  evidence:
  - '2026-08-24: Implemented provider-specific reconciliation of ambiguous mutations (M15-004); acceptance ''Ambiguous mutations
    handled safely'' holds for every mutation class the platform issues. The problem: ArvanCloud documents NO idempotency
    header (contract section 6), so a power mutation whose POST timed out cannot be blindly re-sent - a re-sent reboot would
    reboot a second time, a re-sent power-on after a crash could be a no-op or a duplicate depending on provider state. SOLUTION
    - a three-layer safe-re-send design: (1) NEW OPTIONAL PORT in providers/base.py - PowerEffectProbe protocol (probe_power_effect(provider_server_id,
    action) -> bool | None: True = effect already holds, skip the provider call; False = it does not, re-send is safe; None
    = inconclusive, platform applies the conservative per-action default) plus supports_power_probe() - a structural capability
    the operations domain can use without importing any adapter (invariant preserved: domain imports only ports); (2) ArvanCloud
    ADAPTER implements the probe (arvancloud/client.py): a strictly READ-ONLY get_server whose normalized status is interpreted
    per action - power_on: running->True / stopped->False / else None; power_off: stopped->True / running->False / else None;
    reboot: a reboot ends in the running state, so running->True (the effect holds or is indistinguishable - completing avoids
    the worse failure, a second physical reboot), stopped->False, transient states (building/deleting/error) and a vanished
    server -> None; an unknown action -> None. The probe never issues a POST (pinned by test); (3) EXECUTOR HOOK in PowerOperationExecutor
    (operations/service.py): on a RE-SEND only (operation.attempts >= 2, i.e. an earlier attempt exists - first attempts are
    never probed) against a probe-capable provider: probe True -> _complete_probe_applied() completes the operation WITHOUT
    any provider call, records probe=already-applied in the ledger correlation, applies the same state transition (_POWER_TARGET)
    and audit action as a normal success; probe None on REBOOT -> re-queue with an explicit ''not re-sending to avoid a second
    physical action'' reason and a server.power_probe_inconclusive audit event (the state reconciler drives the row; the worker''s
    existing claim/re-claim loop re-probes each round); probe None on power_on/off -> re-send (steady-state power is safe
    to re-assert); probe raising a ProviderError -> treated as None (conservative); providers WITHOUT the probe (Hetzner)
    fall through to the existing plain re-send path unchanged (its idempotency key already dedupes). CREATE and DELETE ambiguity
    was already safe at the adapter level (M15-002): get-before-create name correlation makes a re-sent create return the
    already-materialized server without a second POST, and delete treats 404 as success - both pinned by tests in this task''s
    suite so the reconciliation story is complete and documented. TESTS: tests/unit/test_arvancloud_reconciliation.py (24
    tests) - the full probe truth table per action (running/stopped/building, vanished server, unknown action), port conformance
    (supports_power_probe + callable), read-only proof (any POST in the probe raises), first-attempt-no-probe, resend-with-effect-applied
    completes without a provider call (asserted await_count 0 on the power method) with ledger correlation and audit and state
    transition, probe-False re-sends, probe-None power_on re-sends, probe-None reboot re-queues WITHOUT re-sending (audit
    server.power_probe_inconclusive, op PENDING), probe-None reboot running completes, probe-error-is-inconclusive, provider-without-probe
    plain re-send fallback, create resend deduplicated by name (no POST), delete 404 success. Full gate: ruff format/check
    clean, mypy clean (101 files), 1424 passed 11 skipped.'
