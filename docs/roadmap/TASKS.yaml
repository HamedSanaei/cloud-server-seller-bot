    limit, and because the run processes servers sequentially (each op completes before the next starts) at most one extra
    slot is ever in use from the run itself. The skipped server keeps its REQUESTED state and its pending op, so the next
    run retries it once a slot frees. 10 tests: account at limit skips its candidate while another account proceeds, zero
    remaining slots skips all, sequential run never exceeds the limit (provider-call concurrency tracked: pre-existing 1 +
    run max 1 <= 2), accounts limited independently (no shared pool), in-flight op for a deleted row does not count, sequential
    run with limit 1 still provisions every candidate, power ops in flight are not counted as create concurrency, invalid
    limit rejected, default limit 3 honored, limit=0 short-circuits. Also added list_in_flight to the existing worker test''s
    FakeOpRepo (port compliance). Full suite 717 passed.'
