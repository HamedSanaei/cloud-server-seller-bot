  evidence:
  - '2026-08-24: Hardened the GitHub Actions quality pipeline (M12-001): .github/workflows/ci.yml rewritten. (1) Cache: astral-sh/setup-uv@v6
    with cache=true on both jobs (uv package cache + virtualenv keyed by the lockfile) and UV_LINK_MODE=copy for stable cached
    venvs across runners. (2) Deterministic gates: both jobs install with uv sync --frozen --all-groups so the lockfile is
    the single source of truth and any pyproject/uv.lock drift fails the build; jobs split into static (ruff check, ruff format
    --check, mypy src, pre-commit run --all-files) and test (pytest with --junitxml, --cov=src xml+term reports, and a --cov-fail-under=88
    coverage regression gate set one point below the measured 88.81% baseline) so a lint regression and a test regression
    surface independently; PYTHONDONTWRITEBYTECODE=1 avoids bytecode churn; per-job timeout-minutes (20/30); concurrency group
    cancels superseded runs per ref; backlog validation (scripts/validate_tasks.py) kept in CI. (3) Artifacts: JUnit results
    (pytest-results.xml) and the coverage report (coverage.xml) uploaded with actions/upload-artifact@v4 (retention 14 days,
    if-no-files-found ignore, if: always() so failed runs still ship their results). Verified locally: workflow YAML parses
    (jobs: static, test), uv sync --frozen confirms a consistent lock (78 packages), and the exact CI pytest command runs
    837 passed / 11 skipped with ''Required test coverage of 88% reached. Total coverage: 88.81%''. Full local gate: ruff
    format check, ruff check, mypy (88 files), pytest 837 passed, validate_tasks OK.'
