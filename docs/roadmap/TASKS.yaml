    converted to the SAME envelope (starlette-level handler so unmatched routes are enveloped too). IDEMPOTENCY: require_idempotency_key
    dependency enforces that EVERY mutating request carries an Idempotency-Key header (missing/blank -> 428 idempotency_required;
    >128 chars -> 400 validation_error); reads never require it; keys join the ledger operation keys downstream so replays
    cannot double-act. IDENTITY SEAM: get_current_user_id dependency (documented auth adapter seam) validates the identity
    header as a UUID else 401 unauthorized envelope. RESOURCES wired to real platform services via container factories (new
