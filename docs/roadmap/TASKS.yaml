    (oldest PENDING server_create > 30m for 10m). RECONCILIATION DRIFT: ReconciliationDriftDetected (increase(reconciliation_outcomes_total{outcome=~''failed|marked_for_review|recreated_operation''}[30m])
    >= 1, page - local state diverged from provider reality) and ReconcilersNotRunning (no outcome at all, not even skipped,
