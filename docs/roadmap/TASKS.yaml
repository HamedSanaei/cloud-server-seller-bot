- id: M02-007
  milestone: M02
  title: Add locale/message catalog abstraction
  priority: P2
  status: done
  owner_hint: H2
  depends_on:
  - M02-003
  acceptance:
  - Persian default; strings not scattered in handlers.
  evidence:
  - '2026-08-24: Added the locale/message catalog abstraction (M02-007) in new module src/cloud_platform/core/i18n.py. Locale
    StrEnum (FA Persian = platform default via DEFAULT_LOCALE, EN English); MessageCatalog - immutable per-locale message
    table (MappingProxyType-backed, render() with str.format placeholders, raises UnknownMessageKey for missing keys instead
    of silent fallback so handlers cannot drift back to literals); get_catalog(locale=None) returns the built-in catalog;
    Translator(locale=None, catalog=None) is the locale-bound handler-facing object with t(key, **params) (also callable as
    t(...)). Initial 18-key catalog in both locales covers the platform''s user-facing surfaces: greeting.start/help, terms.required/accepted,
    user.frozen/banned/not_found, wallet.insufficient_balance/deposited, quota.exceeded, maintenance.blocked, offer.unavailable/show/hide,
    server.created/destroyed, operation.failed, error.unknown. The Telegram start handler (bot/main.py) now renders greeting.start
    from the catalog instead of a scattered English literal - the platform default output is Persian. Domain modules keep
    their English exception messages by design (log/operator text); only user-facing handler output routes through this module.
    13 tests: Persian default (DEFAULT_LOCALE, get_catalog(), Translator() all fa; default greeting is Persian, no ''Welcome''),
    English locale available, parameter substitution in both locales, call alias, missing parameter raises KeyError, unknown
    key raises UnknownMessageKey in every locale, catalog table immutable, completeness (fa/en key sets identical; all documented
    keys present; placeholder parity between locales parsed via string.Formatter so a handler can pass one param set to either
    locale), the bot start handler renders the Persian catalog greeting and the old scattered literal is gone, and an injected
    custom catalog wins over the built-ins. Full suite 930 passed.'
