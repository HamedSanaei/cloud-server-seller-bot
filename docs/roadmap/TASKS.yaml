    LIVE TWICE, kept honest: prose in docs/ops/load_model.md (tables with a WHY for every number) and executable values in
    NEW src/cloud_platform/planning/load_model.py - tests assert the two agree. USERS UserPopulation(registered=10000, daily_active=1500=15%
    DAU-typical, peak_concurrent=120 evening burst): ordering invariant enforced (active<=registered, peak<=active). ORDERS
    OrderMix: fractions of all user actions summing to EXACTLY 1 (validated, negatives rejected): reads dominate by design
    (server_read .45 + catalog .20 + wallet .15 = .80), power .12 is the common mutation, create .02 / delete .015 / rebuild
