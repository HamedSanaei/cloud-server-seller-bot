- id: M04-008
  milestone: M04
  title: Cache customer catalog safely
  priority: P2
  status: done
  owner_hint: H2
  depends_on:
  - M04-007
  acceptance:
  - Cache invalidates on offer/price change.
  evidence:
  - '2026-08-24: Added the safe customer catalog cache (M04-008) as new module src/cloud_platform/modules/catalog/cache.py.
    CatalogCache decorates any CatalogRepository and implements the same port (get_offer / upsert_entry / set_offer_enabled),
    so it swaps in at the wiring point and every in-process catalog reader and writer shares one instance. Safety properties:
    (1) epoch invalidation - every mutation (price ingestion upsert, offer visibility change) bumps an internal epoch after
    the write commits, and cached entries tagged with an older epoch are treated as misses, which directly satisfies ''cache
    invalidates on offer/price change''; (2) TTL safety net - entries expire after ttl_seconds (default 60, injectable monotonic
    clock; ttl=0 disables caching) so a writer that bypasses the cache (direct DB write from another process) cannot keep
    stale data past the TTL; (3) negative caching - unknown offers are cached like any result so repeated missing-offer lookups
    do not hammer the store; (4) no stale write-through - if an invalidation occurs while a fetch is in flight, the fetched
    value is returned for that call but not cached, so a racing admin write is never shadowed (epoch snapshot before fetch,
    compared after). Manual invalidate(ref|None) evicts one entry or the whole cache and returns the eviction count; a conservative
    epoch bump on per-ref eviction also ages out other entries (correctness over hit ratio - catalogs are small), documented.
    CacheStats (hits/misses/invalidations/entries) exposes counters for logging. Exported CacheStats/CatalogCache from the
    catalog package. 17 tests: reads (hit served from cache with inner hit exactly once, distinct refs independent, negative
    cache, ttl=0 never caches, negative ttl rejected), invalidation on changes (price upsert invalidates - old price 1000
    then 1500 re-fetched, visibility hide invalidates, LookupError from set_offer_enabled still propagates, upsert created/updated
    return values pass through, racing invalidation during fetch is returned but not cached and the next read re-fetches),
    TTL and manual invalidation (entry expires at 30.1s with fake clock, invalidate-all evicts 2, per-ref invalidation evicts
    1 and both refs re-fetch under the conservative epoch semantics, invalidate of missing ref returns 0), port compatibility
    (mypy-verified: CatalogCache assigned to a CatalogRepository variable and used for all three port methods), stats accounting,
    and catalog row id preservation. Full suite 917 passed.'
