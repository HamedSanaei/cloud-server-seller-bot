    PROVIDERS ProviderCapacity: published limit x max_utilized_fraction -> rps_budget; HEADROOM_FACTOR=0.5 mandated (half
    of any published rate limit stays free at modeled peak for incident sweeps + catalog sync bursts); fraction bounds validated
