- id: M10-004
  milestone: M10
  title: Implement cost circuit breakers
  priority: P0
  status: done
  owner_hint: supervisor
  depends_on:
  - M06-008
  acceptance:
  - Global/provider-account daily thresholds can halt new spend.
  evidence:
  - '2026-08-24: Implemented cost circuit breakers (M10-004); acceptance ''Global/provider-account daily thresholds can halt
    new spend'' holds. Design: the daily spend of the platform is the provider COST accrued in the current UTC day (the cost_minor
    of the accrual-period records, M06-005) - what we actually spend with providers. A scope whose accrued cost reaches its
    configured cap is ''tripped'' and new orders for that scope are refused until the limit is raised or the day rolls over.
    NEW domain (compute/domain.py): CostLimitScopeKind (GLOBAL / PROVIDER_ACCOUNT), CostLimit (scope, limit_minor int minor
    units, provider_account_id for per-account rows, enabled; validated: global has no account id, account needs one, no negative
    limits; active = enabled and limit > 0 so a zero/disabled row never trips), CostLimitTrigger (the tripped scope + limit
    + spent level for the error message), CostLimitRepository port (get_global / get_for_account / list_all / upsert / remove)
    and the CostCircuitBreaker port the create command consults: check(provider_account_id) -> CostLimitTrigger | None (most
    specific first - the account''s own limit before the global one). NEW service (compute/service.py): CostCircuitBreakerService(limit_repo,
    server_repo, accrual_repo, clock) - _day_window gives the current UTC day as a half-open [start, end); check() sums today''s
    cost via the NEW AccrualPeriodRepository.daily_cost_total(day_start, day_end, server_ids) (port + SqlAlchemy implementation:
    SUM(cost_minor) over period_start in the window restricted to the given server ids, empty set -> 0) for the account''s
    own servers (NEW ServerRepository.list_account_server_ids, non-deleted) against the account limit, then over every non-deleted
    server (NEW ServerRepository.list_non_deleted_ids) against the global limit; status() returns (limit, spent_today) for
    every active limit for inspection. GATE in CreateServerService: optional cost_breaker constructor param wired at step
    3.5 - right after the provider-account lookup, BEFORE any funds are reserved (same fail-fast position as the M10-005 maintenance
    switch, which stays in front of it); a tripped scope raises the new CostLimitReachedError (a CreateServerCommandError)
    naming the scope (all provider accounts / provider account <id>) and the spent-vs-limit minor amounts. Admin side: CostLimitAdminService(limit_repo,
    audit_repo) with set_global / set_for_account (admin-gated via admin:manage_settings, audited as cost_limit.set with scope/limit/enabled
    metadata; a limit of 0 or enabled=False disables the scope) and clear (cost_limit.clear, True when a row was removed)
    - the admin API surface lands with M14-003. DB: new cost_limits table (alembic 0020, model in db/base.py) with unique
    (scope, provider_account_id) - one row per scope, provider_account_id NULL for the global row, FK to provider_accounts
    CASCADE. 20 new tests: check() - no limits never trip, a global trip blocks every account (spent aggregated across accounts),
    an account trip blocks only that account, the account trigger wins over a simultaneously tripped global one (most specific),
    disabled and zero limits never trip, the queried window is exactly the current UTC day with the right server set, and
    a per-account scope ignores other accounts'' spend; status() - active limits listed with their spent today, inactive limits
    skipped; create-command gate - a tripped breaker raises CostLimitReachedError and is consulted for the order''s account
    BEFORE any hold is created or server row persisted (create_hold and servers.create both zero calls), a clear breaker allows
    the normal happy path; admin - set_global audited with metadata, a non-admin actor is rejected (PermissionDeniedError)
    with no row written, clear removes the row (True then False), negative limits rejected, list returns all rows; domain
    validation (global rejects an account id, account requires one, negative rejected, active requires enabled+positive).
    Also added the cost_breaker parameter to the existing create-command test harness (_Deps). Full suite 1197 passed.'
