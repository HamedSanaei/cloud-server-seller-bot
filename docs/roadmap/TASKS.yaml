    log_repo) with started(server, detail) for non-deduplicated progress and succeeded(server, detail)/failed(server, reason)
    for the final events: record_final(user_id, server_id, kind, detail) -> bool atomically inserts a row; only the FIRST
    record (True) triggers notifier.send, so a crash, worker retry, or overlapping reconciler round can never make the user
