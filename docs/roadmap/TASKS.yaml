- id: M06-005
  milestone: M06
  title: Implement periodic accrual job
  priority: P0
  status: done
  owner_hint: supervisor
  depends_on:
  - M05-002
  - M06-004
  acceptance:
  - No duplicate charges on retry.
  evidence:
  - '2026-08-24: Implemented the periodic usage accrual job (M06-005). New src/cloud_platform/modules/billing/service.py:
    AccrualJob settles COMPLETE quantum-sized usage periods for RUNNING servers, anchored at the server''s creation instant
    and tracked by a new accrual watermark (CloudServer.last_accrued_at, servers.last_accrued_at column, migration 0015).
    The trailing partial quantum is deliberately never settled here - it is billed as the final segment at deletion (M06-006)
    - so no usage slice is ever charged twice. Idempotency (acceptance: no duplicate charges on retry): every settlement moves
    money under a deterministic idempotency key accrual:{server_id}:{period_start_epoch_utc} (UTC-normalized, offset-independent);
    the first period is instead settled by CAPTURING the creation-time hold (ledger key capture-server-create:{idempotency_key})
    because that hold reserved exactly the first quantum''s funds at creation - capturing consumes what was reserved with
    no balance race, and if the hold was released by the failed-create path the period falls back to a plain debit. Before
    moving money the job looks up BOTH candidate keys in the append-only ledger (key selection is history-independent), so
    a replayed period is a no-op that only advances the watermark; the ledger''s unique idempotency-key constraint and a new
    unique-keyed accrual_periods business-record table (migration 0015: period window, quanta, cost_minor from the pinned
    price snapshot, selling_minor, currency) are durable backstops. New ports: AccrualPeriodRepository (get_by_key/add/list_between
    for margin reporting) and JobLock; new SqlAlchemyAccrualPeriodRepository and PostgresAdvisoryAccrualLock (session-level
    pg_try_advisory_lock, same pattern as the catalog sync) serialize runs across processes. Money is always integer minor
    units from the immutable per-server price snapshot (MissingSnapshotError when absent); insufficient balance leaves the
    period unsettled for the next run and is counted in the report (deterministic signal for the M06-007 low-balance policy);
    per-server failures never break the run; one SYSTEM audit event per run (billing.accrual) with counters; AccrualRunReport.render()
    is ASCII. Wiring: arq job accrue_usage in worker/settings.py builds the full job from the shared SessionFactory. 21 tests:
    first period captures the creation hold (no fresh debit, business record + watermark correct), partial period not settled,
    later periods are plain debits, multiple periods in one run, and the acceptance proof: crash-before-watermark-save replay
    posts 0 charges with 1 replay, no second debit/capture, no duplicate ledger rows and the watermark restored; no-elapsed-time
    noop; no duplicate accrual rows on replay; released-hold fallback to debit; already-captured hold replay moves nothing;
    insufficient balance leaves the period unsettled with the report signal; one bad server (missing snapshot) does not break
    the run; missing wallet counted as error; lock-not-acquired skips entirely, lock-acquired proceeds; charge key determinism
    across timezones; created_at validation; AccrualPeriod validation; ASCII render; corrupted watermark rebase; per-run audit
    event; typed MissingSnapshotError. Full suite 951 passed.'
- id: M06-006
  milestone: M06
  title: Implement final deletion charge
  priority: P0
  status: done
  owner_hint: H1
  depends_on:
  - M06-005
  acceptance:
  - Final segment posted once after confirmed deletion.
  evidence:
  - '2026-08-24: Implemented the final deletion charge (M06-006) as FinalChargeService in src/cloud_platform/modules/billing/service.py.
    When a server''s deletion is confirmed (state DELETED, deletion timestamp), the service settles the trailing PARTIAL quantum
    that the periodic accrual job deliberately left unsettled (it only settles complete periods), so every usage slice of
    a server''s life is charged exactly once across the whole lifecycle. Window = [last_accrued_at or created_at, deleted_at];
    a zero-length window (deleted exactly on a grid boundary) charges nothing. Two deterministic legs: (1) if the creation
    hold is still CREATED and the window covers the first quantum, it is CAPTURED (ledger key capture-server-create:{ik})
    - the hold reserved exactly that quantum''s funds, no balance race; (2) any remaining window is billed flat as one debit
    plus one CHARGE entry under the deterministic key final:{server_id}, a partial quantum billing as a full one per the billing
    policy. Every leg is idempotent under its own key, so a full replay (crash before the watermark save) re-derives both
    legs and moves nothing, and a partial replay (crash between legs) settles exactly the missing leg - the final segment
    is posted once. A business record for the margin report covers the FULL final window (both legs) under a unique per-server
    key, so a partial-replay run still records the complete amount; a SYSTEM audit event (billing.final_charge) is recorded
    per settlement with charged amount, captured/replayed flags and the entry key; the server watermark advances to the deletion
    instant. Validation: DELETED state required, deleted_at >= created_at, wallet and immutable price snapshot required (MissingSnapshotError).
    CloudServer gained deleted_at (domain + repository mapping/save; the column already existed from the schema). 12 tests:
    partial first quantum captures the hold (no fresh debit, record + watermark correct), full replay moves nothing (no second
    capture/debit/entry), no-hold flat billing under final: key with replay, long window = 1 captured + 1 flat quantum with
    the business record covering both (selling=2x, cost=2x) and full replay + crash replay (watermark lost) both settling
    nothing, crash between legs settling only the missing leg with the record still covering the full window, grid-aligned
    deletion charges nothing, zero-length window charges nothing, later accrued periods then a partial final quantum (balance
    math across 3 quanta), and validation (non-DELETED state rejected, missing snapshot typed error, deleted-before-created
    rejected, audit event contents). Full suite 963 passed.'
- id: M06-007
  milestone: M06
  title: Implement low-balance policy
  priority: P0
  status: done
  owner_hint: supervisor
  depends_on:
  - M05-003
  - M06-005
  acceptance:
  - Warn/grace/auto-delete decisions are deterministic.
  evidence:
  - '2026-08-24: Implemented the low-balance policy (M06-007) in src/cloud_platform/modules/billing/service.py. Pure deterministic
    decision function decide_low_balance(balance, config, low_balance_since, now) -> LowBalanceDecision (NONE / WARN / GRACE
    / AUTO_DELETE / RECOVERED): balance at/above threshold is healthy (RECOVERED only when a stale watermark exists), balance
    below threshold with no watermark is WARN (starts the grace clock), below threshold within the grace window is GRACE (silent
    - the user was already warned), at/older than the grace window is AUTO_DELETE. The decision depends only on (balance,
    config, watermark, now) - the acceptance line - and is proven deterministic by a repeated-inputs test across balance/watermark
    combinations. The grace clock is a new persisted per-server watermark servers.low_balance_since (migration 0016; CloudServer.low_balance_since
    field + repository mapping/save): it starts when the server first falls below the threshold and is cleared on recovery,
    so the decision state survives process restarts and is auditable. LowBalancePolicyService.evaluate(config, now) passes
    over all RUNNING servers: WARN starts the watermark and notifies the user; GRACE changes nothing (no re-notification spam,
    no state churn); AUTO_DELETE transitions the server to DELETE_REQUESTED through the domain lifecycle (RUNNING -> DELETE_REQUESTED
    is an allowed transition) and notifies - the deletion saga (M07-007) owns the actual stop, provider deletion and final
    charge, so the policy never stops or deletes resources and never moves money; RECOVERED clears the watermark. State changes
    are persisted via the server repository and every decision is audited (billing.low_balance_<decision> SYSTEM events with
    balance/threshold/grace metadata). User notification goes through a new BalanceNotifier port (the bot/API integration
    implements it later; the default is a structured log line). Config: LowBalancePolicyConfig(threshold_minor, grace_hours)
    with validation, wired from Settings fields low_balance_threshold_minor (default 5000) and low_balance_grace_hours (default
    24); scheduled as arq job evaluate_low_balance in worker/settings.py. 18 tests: the pure decision function (healthy none,
    exact-threshold boundary healthy, just-below warn, within-grace grace, exact-grace-boundary auto-delete, beyond-grace
    auto-delete, recovery, determinism across repeated inputs, naive watermark treated as UTC, config validation) and the
    service state machine (healthy untouched, falling server warns + starts clock + notifies once, within-grace silent with
    no state churn, grace exhausted requests deletion (state DELETE_REQUESTED) + notifies, recovery clears watermark, missing
    wallet treated as balance 0, mixed fleet in one pass (none/warn/grace/auto_delete with a 10h-into-window server correctly
    in GRACE while the 30h-into-window one auto-deletes), audit action + metadata per decision). Full suite 981 passed.'
