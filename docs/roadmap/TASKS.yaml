    once per (server, episode) and a new episode may re-notify. New in src/cloud_platform/modules/notifications: LowBalanceNotificationKind
    (WARN / AUTO_DELETE / RECOVERED - the three notified levels; NONE and GRACE are silent), LowBalanceNotificationEvent (user,
    server, kind, signed balance_minor, currency, episode, at + ASCII render with integer divmod money), LowBalanceNotifierPort
    protocol with the established _LoggingLowBalanceNotifier default (bot integration replaces it), LowBalanceNotificationLogRepository
    protocol and LowBalanceNotifier(notifier, log_repo).notify(user_id, server_id, decision, balance_minor, currency, episode)
    -> bool: NONE/GRACE never notify and never touch the log; the other levels are recorded in the persistent log and only
    the FIRST record of (server_id, kind, episode) delivers. Episode = the server''s low-balance watermark: the policy passes
    the NEW watermark on WARN, the EXISTING one on AUTO_DELETE, and the CLEARED one on RECOVERED, so a double-run of the policy
    job cannot notify twice, a level change in the same episode (warn -> auto_delete) notifies, and a recovered-then-later
    re-warn is a new episode and notifies again. DB: new table low_balance_notifications (alembic 0019, model in db/base.py)
    with the UniqueConstraint (server_id, kind, episode) as the dedup guard, storing the balance (minor units) + currency
    at notification time; SqlAlchemyLowBalanceNotificationLogRepository.record inserts and treats IntegrityError as ''already
    sent'' (rollback + False). The BalanceNotifier port gained an optional episode parameter (backwards compatible) and _LoggingNotifier
    logs it; LowBalancePolicyService now passes the episode at all three notified branches and, new, also notifies RECOVERED
    (with the cleared watermark) so the user learns the episode closed - the audit trail was already recording all decisions.
    Worker wiring: the evaluate_low_balance job now builds LowBalanceNotifier(_LoggingLowBalanceNotifier, SqlAlchemyLowBalanceNotificationLogRepository)
    behind a small adapter that maps the BalanceNotifier port (skipping silently when no episode is present) with the configured
    default_currency. 11 new tests: same level + same episode notifies once across three attempts (the first delivery''s balance
    is the one recorded), a new episode re-notifies the same level, warn and auto_delete in one episode are independent kinds
    (each once), recovered closes the episode, different servers are independent, NONE and GRACE (parametrized) never notify
    and never touch the log, the event render uses integer minor units (''-0.07 EUR''), the logging port logs (caplog), the
    SQL repository''s first record wins with the mapped fields and a duplicate (IntegrityError) rolls back and returns False;
    plus the M06-007 policy tests updated: WARN carries episode=new watermark, AUTO_DELETE carries episode=existing watermark,
    and RECOVERED now notifies with the cleared watermark. Full suite 1177 passed.'
