    action-not-allowed->409, in-progress->409 operation_in_progress, failed->409 conflict, returning 202 with replayed/requeued
    flags; GET/POST/DELETE /v1/ssh-keys through SshKeyService (fingerprints only, never key material); DELETE /v1/servers/{id}
    reserved as stable 501 not_implemented until the REST order/delete saga phase (documented). STABILITY TESTS tests/unit/test_api_v1_contract.py
    (12): envelope shape asserted on unknown routes/401/validation/domain errors, mutation-requires-key matrix incl. oversized
