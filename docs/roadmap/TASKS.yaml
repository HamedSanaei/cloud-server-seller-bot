  evidence:
  - '2026-08-24: Added Prometheus metrics (M11-001) in a new framework-free observability package. New dependency prometheus-client
    (pinned >=0.21,<1). PlatformMetrics owns a dedicated CollectorRegistry (module-level metrics singleton for the process;
    isolated registries for tests) with four instrumented families: API (cloud_platform_api_requests_total by method/route-template/status
    + api_request_duration_seconds histogram), jobs (job_runs_total by job/status + job_duration_seconds histogram), provider
    (provider_calls_total by provider/operation/outcome + provider_call_duration_seconds), and billing (billing_events_total
    by event/result). Closed cardinality discipline: route templates instead of raw paths, job names, endpoint-shape operation
    labels, short outcome codes; async context helpers job(name) and provider_call(provider, operation) plus record_billing_event.
    Emission points wired: (1) API - create_app adds an HTTP middleware that times every request and a /metrics endpoint serving
    the Prometheus text format; (2) jobs - CatalogSyncJob.run, ProvisioningWorker.run_once (thin wrapper over _run_once) and
    the arq reconcile_provider_resources job each record a job run via metrics.job; (3) provider - HetznerCloudProvider._request
    splits into a metrics.provider_call wrapper (outcome via provider_outcome mapping: success/auth_error/not_found/conflict/rate_limited/unavailable/provider_error/error)
    and _perform_request, with _operation_label shaping numeric id segments to {id} so labels stay bounded; (4) billing -
    HoldService create_hold/release_hold/capture_hold emit hold_created/hold_released/hold_captured with ok/insufficient_balance/conflict/not_found
    results. 10 new tests: job ok/error statuses + duration histogram on an isolated registry, provider call success/rate_limited
    outcomes, billing event + render() contains the family, provider_outcome mapping, API middleware counts /health/live under
    its route template and /metrics returns text/plain exposition, delta-based proofs that catalog_sync/provisioning_worker/arq
    reconcile jobs and hold creation each bump the singleton by exactly 1 (delta-based because other suite tests drive the
    same singletons), and operation-label shaping. Full suite 802 passed.'
