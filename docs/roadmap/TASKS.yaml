  evidence:
  - '2026-08-23: Implemented the usage segment calculator in modules/billing/domain.py (M06-004). calculate_usage_segments(started_at,
    ended_at, schedule) splits a usage window into quantum-grid slices and prices each one: boundaries are the window start,
    every UTC-aligned quantum-grid instant strictly inside (floor(epoch/quantum)*quantum, so hour/minute/day policies share
    one code path), and the window end. Each slice is charged with the existing calculate_usage_charge primitive (ceiling
    rounding: a partial quantum bills as a full one, floored by the policy minimum per slice) at the price from the PricedPeriod
    schedule whose effective_from covers the slice start, so a price change applies from the next grid boundary - never mid-slice.
    Zero-length window yields no segments and the minimum-quantum floor never fires on an empty window. Validation: tz-aware
    required on all datetimes, ended>=started, non-empty ascending schedule, and a window before the first priced period raises.
    sum_segments aggregates quanta/cost/charge with a currency-mismatch guard. 23 boundary/rounding tests (the acceptance
    line) cover: sub-quantum slice bills one full quantum, 1h01m over two grid hours bills 3, exact-grid window bills exact
    quanta with no zero-length prefix or tail, zero-length window empty, end-on-grid included in last slice, day-quantum midnight
    span (23:50 to 00:10) bills two full days, 45s of a minute quantum bills one, segment contiguity/coverage, grid-aligned
    total equals the flat single-interval charge, price change from next grid boundary with exact per-segment amounts, mid-slice
    price step defers to the boundary, per-segment minimum floor, non-UTC offset (Tehran +3:30) normalized to the UTC grid,
