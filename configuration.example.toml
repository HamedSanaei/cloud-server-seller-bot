# Cloud Server Seller — the ONE canonical runtime configuration template.
#
# This file is the single configuration contract of the repository: it
# documents EVERY supported section/key, and a new operator-facing setting must
# be added here in the same change that introduces it. There is deliberately no
# second, environment-flavoured copy — an older production-flavoured example
# lived under `deploy/production/`, drifted out of sync and was deleted, which
# is exactly the failure this single template prevents.
#
# Local development:
#
#   cp configuration.example.toml configuration.toml
#
# Production (server-owned file, mounted read-only into every container):
#
#   sudo install -d -m 0750 -o root -g docker /etc/cloud-server-seller
#   sudo install -m 0640 -o root -g docker \
#       configuration.example.toml /etc/cloud-server-seller/configuration.toml
#   sudo "$EDITOR" /etc/cloud-server-seller/configuration.toml   # fill secrets
#
# The operator keeps the REAL `configuration.toml` locally (git-ignored) and
# uploads/copies it to that server path. A deployment NEVER writes it: the
# release only mounts it read-only. When upgrading, compare this template with
# the real file, merge what is missing, validate, then upload.
#
# The application finds the file in this order:
#   1. $CLOUD_PLATFORM_CONFIG_FILE   (bootstrap: only says WHERE the file is)
#   2. ./configuration.toml          (development)
#   3. /etc/cloud-server-seller/configuration.toml  (production default)
#
# Precedence of values (highest first):
#   explicit constructor arguments > environment variables > this file > .env
# Environment variables exist for bootstrap and tests only. Production keeps
# every secret in this file, which is why `configuration.toml` is git-ignored.
#
# Every value below is a safe FAKE placeholder: never commit a real
# configuration.toml. Environment-dependent settings show the production form
# in a comment next to the SINGLE supported key.

[app]
# Local development (the value that keeps this template self-consistent):
#   environment = "development"
# Production MUST say "production": that is what enables the production-only
# validation (public https payment callbacks, redis Telegram session backend).
environment = "development"        # development | staging | production
log_level = "INFO"
default_currency = "USD"

[database]
# Local example has no password; production inserts it after "cloud"
# (percent-encoded when it contains special characters) and points at the
# compose service instead of localhost:
#   url = "postgresql+asyncpg://cloud@postgres:5432/cloud"
url = "postgresql+asyncpg://cloud@localhost:5432/cloud"

[redis]
# Local development; the production compose service is `redis`:
#   url = "redis://redis:6379/0"
url = "redis://localhost:6379/0"

[telegram]
bot_token = "CHANGE_ME"
callback_signing_key = "CHANGE_ME"
# The two operator ids belong to THIS section (never to [telegram.sessions],
# which only owns transient bot state):
#   admin_chat_id    renewals / attention alerts, 0 = unset
#   support_contact  shown to customers as the support handle
admin_chat_id = 0                  # renewals / attention alerts (0 = unset)
support_contact = "@support"

# Telegram TRANSIENT state: callback references, remembered selections,
# one-time destructive confirmations and free-text prompts.
#
# `redis` is REQUIRED in production. This state is disposable (it only ever
# expires), but it must be SHARED: with `memory` a bot restart loses the
# buttons a customer is holding, and a second replica would resolve the same
# reference differently. The factory refuses `memory` outside development, and
# the release-owned production compose additionally forces
# TELEGRAM_SESSIONS_BACKEND=redis, so an older server file that still says
# `memory` resolves to redis at runtime — keep this value correct anyway.
#
# Safety note: losing Redis blocks mutations (fail closed), it never permits
# one. Nothing here is a secret: no API key, password, credential or console
# URL is ever stored or embedded in a key name.
[telegram.sessions]
backend = "redis"                  # redis | memory (development/test only)
namespace = "cloud-platform:bot"  # key prefix; change to isolate environments
reference_ttl_seconds = 1800       # how long a button's reference resolves
prompt_ttl_seconds = 900           # how long a text prompt waits for an answer
confirmation_ttl_seconds = 300     # how long a destructive confirmation is valid
replay_ttl_seconds = 1800          # how long a consumed token is remembered

# Private business-logger channel. The bot must be a member/administrator of
# this channel. Events are delivered through a durable outbox, so a Telegram
# outage never affects checkout, payment or reconciliation.
[telegram.logger]
enabled = true
chat_id = -1000000000000
log_purchases = true
log_recharges = true
log_payment_failures = true
log_order_failures = true
log_admin_wallet_adjustments = true

# ---------------------------------------------------------------------------
# Providers
#
# `market` places the provider in the storefront: "iran" or "foreign".
# `display_name` is the customer-facing name (internal provider keys are
# never shown). `enabled = false` hides a configured provider from the store.
# ---------------------------------------------------------------------------

[providers.leaseweb]
enabled = true
market = "foreign"
display_name = "Leaseweb"
api_key = ""  # fill in production; empty means "not configured"
base_url = "https://api.leaseweb.com"
# Discovery seeds ONLY (may be empty): locations worth probing, never the
# sellability authority. Account eligibility is decided per location by live
# probes; newly enabled locations appear (and removed ones disappear)
# automatically on the next catalog refresh.
locations = ["AMS-01", "FRA-01"]
os_allowlist = []
order_os_only_free = true
contract_term = "1_MONTH"
billing_cycle = "1_MONTH"
# Hourly cloud: how long ONE definitive provider account-capacity refusal
# (Leaseweb PC-2031 "Customer limit reached") keeps that credential out of
# NEW-order publication. Leaseweb publishes no quota endpoint, so capacity is
# learned from a refusal; the window is bounded so one refusal can never disable
# an account permanently, and the catalog sync re-probes once it expires.
# Existing servers, orders and reconciliation are never affected. Minimum 60.
cloud_account_limit_ttl_seconds = 3600

# --- Multiple Leaseweb credential accounts (LEASEWEB-MULTIACCOUNT) ----------
# A Leaseweb API key / Sales Organization only sees a narrow set of locations,
# so the platform can hold SEVERAL keys while customers still see ONE provider
# called "Leaseweb". The locations of every account are merged into the single
# storefront automatically; nothing about accounts is customer-visible.
#
# Each account discovers its OWN eligible locations from live, read-only
# provider responses — there is deliberately NO location mapping to maintain
# here. Adding a key is: append a block, restart the services. No code change,
# no deployment secret, no database insert.
#
#   id       stable, non-secret handle (shows up in logs and CLI output)
#   api_key  the provider credential — never logged, never printed
#   enabled  false keeps the account configured but unusable
#   priority lower wins when several accounts can serve the same location
#   label    optional operator-facing text (`leaseweb accounts doctor`)
#   state    "active"   -> discovery + new orders + manages what it owns
#            "draining" -> no new orders; existing servers stay manageable
#            "disabled" -> not used at all (operator intervention required)
#
# These keys live ONLY in this server-owned file (mounted read-only into the
# containers). Never put them in deploy.env, the release compose or a CI
# variable: the deployment workflow must never carry provider credentials.
#
# Leaving every account commented out keeps the deprecated single `api_key`
# above working exactly as before: it becomes the account id "default",
# which is also what rows created before multi-account support are routed to.
#
# Preferred form — the table key IS the account id, so nothing is repeated and
# nothing can drift out of sync:
#
# [providers.leaseweb.accounts.sales-org-north]
# api_key = "CHANGE_ME"
# enabled = true
# label = "Frankfurt Sales Organization"
# priority = 100
#
# [providers.leaseweb.accounts.sales-org-uk]
# api_key = "CHANGE_ME"
# enabled = true
# label = "UK Sales Organization"
# priority = 200
#
# Equivalent list form (the id is a field):
#
# [[providers.leaseweb.accounts]]
# id = "sales-org-north"
# enabled = true
# api_key = "CHANGE_ME"
# priority = 100

[providers.arvancloud]
enabled = true
market = "iran"
display_name = "ArvanCloud"
api_key = ""  # fill in production; empty means "not configured"
base_url = "https://napi.arvancloud.ir/ecc/v1"
region = "CHANGE_ME"

[providers.hetzner]
enabled = false
market = "foreign"
display_name = "Hetzner"
api_token = "CHANGE_ME"
base_url = "https://api.hetzner.cloud/v1"

# Commercial product families (STOREFRONT-REWORK): one provider can sell
# more than one product type. Each family names its billing model
# ("prepaid_monthly_fixed" or "hourly") and its customer-facing product
# name. Providers without a families section expose one implicit family
# per billing model found in their sellable offers.
[providers.leaseweb.families.vps]
billing_model = "prepaid_monthly_fixed"
display_name = "وی‌پی‌اس"

[providers.leaseweb.families.cloud]
billing_model = "hourly"
display_name = "کلود"

# ---------------------------------------------------------------------------
# Automatic catalog sync + pricing (STOREFRONT-V2, one-time setup)
#
# After this section, provider plan changes need NO manual
# sync-offers / price-book / enable commands: the worker refreshes costs
# from the official APIs every interval, reprices auto-priced rows with the
# configured markup (foreign costs use the configured catalog currency) and publishes
# eligible rows — unless the operator blocked them (offers disable), which
# the sync never undoes. Verify with:
#   python -m cloud_platform.cli catalog auto-sync doctor
# ---------------------------------------------------------------------------

[storefront.catalog_sync]
enabled = true
interval_seconds = 900
# Dedicated timeout for ONE catalog refresh job, in seconds. A full Leaseweb
# pass walks hundreds of products across every account/region with optional
# detail calls, so it legitimately exceeds the generic 120s worker job
# timeout; ARQ would otherwise cancel a healthy run mid-way and leave the
# affected rows unpriced. Only this cron job gets the longer budget:
# payment/order/reconciliation jobs keep `WorkerSettings.job_timeout`.
# A value above `interval_seconds` is clamped to it, because a job must not
# outlive its own cadence (overlapping runs also serialize on the catalog
# advisory lock).
timeout_seconds = 600
# Safety margin (seconds) on top of `interval_seconds + timeout_seconds`.
#
# Every NEW catalog price must stay provable until the next scheduled refresh
# has completed, otherwise the storefront empties between two healthy syncs the
# moment the reference rate behind its prices expires (the 2026-09-26 Leaseweb
# blackout: a "fresh" GBP->USD quote with ~2 minutes of TTL left was published
# for every offer, and the whole foreign market went invisible ~15 minutes
# before the next sync repriced it). Never set this to 0 in production: it
# absorbs scheduler jitter and a slower-than-usual provider walk.
fx_safety_margin_seconds = 300

[storefront.pricing.leaseweb]
mode = "markup"
markup_percent = 25
auto_publish = true

# Family-specific policy wins over the provider-wide one when both exist
# (key "provider.billing", e.g. hourly cloud priced apart from monthly VPS).
[storefront.pricing."leaseweb.hourly"]
mode = "markup"
markup_percent = 25
auto_publish = true

[storefront.pricing.hetzner]
mode = "markup"
markup_percent = 25
auto_publish = true

[payments.zarinpal]
# Disabled by default: enabling requires a real merchant credential, and
# placeholder credentials are deliberately rejected by validation.
enabled = false
merchant_id = "CHANGE_ME"
base_url = "https://sandbox.zarinpal.com/pg/v4/payment"
sandbox = true
# Production MUST be an absolute, PUBLIC https URL on the real domain, e.g.
#   https://your-domain.example/api/v1/payments/zarinpal/callback
callback_url = "https://example.com/api/v1/payments/zarinpal/callback"

[payments.tetraminator]
# Second Iranian gateway (Toman). Disabled until the operator opts in by
# setting enabled = true AND a real api_key below. Amounts are integer Toman;
# the documented minimum invoice is 50,000 Toman.
enabled = false
api_key = "CHANGE_ME"  # pragma: allowlist secret
base_url = "https://api.tetraminator.com/v1"
# Production MUST be https on the real public domain, e.g.
#   https://your-domain.example/webhooks/payments/tetraminator
callback_url = "https://example.com/webhooks/payments/tetraminator"
timeout_seconds = 30

# ---------------------------------------------------------------------------
# Currency / FX resolution (platform-level, provider-neutral)
#
# Domestic/payment FX uses AbanTether. Global provider-cost normalization uses
# Frankfurter's official reference-rate endpoint; it has no bid/ask spread and
# never settles payments. Foreign catalog offers are exact native Decimal -> FX
# -> operator markup -> final target-currency ceiling. USD display proxy rules
# below belong only to the domestic/payment path.
# ---------------------------------------------------------------------------

[fx]
enabled = true
# Family switches; the legacy `enabled` key remains a master default.
domestic_enabled = true
global_enabled = true
# Explicitly separate the two FX families.
domestic_provider = "abantether"
global_fiat_provider = "frankfurter"
# Foreign storefront rows must sell in this canonical catalog currency.
catalog_pricing_currency = "USD"
# Legacy domestic UI/payment display only; it does not change catalog pricing.
default_display_currency = "IRT"
quote_ttl_seconds = 60
max_stale_seconds = 300
charge_max_stale_seconds = 30
request_timeout_seconds = 5
allow_usdt_proxy_for_display = true
allow_usdt_proxy_for_settlement = false

[fx.abantether]
base_url = "https://api.abantether.com"
eur_symbol = "EUR"
usd_proxy_symbol = "USDT"

[fx.frankfurter]
base_url = "https://api.frankfurter.dev"
request_timeout_seconds = 5
quote_ttl_seconds = 3600
# Last-known-good reference rates may be reused for catalog repricing only
# within this bounded window; this is not a payment/settlement rate.
max_stale_seconds = 345600
catalog_max_stale_seconds = 86400

[security]
# 32-byte url-safe base64 keys. Generate with:
#   python -c "import base64; from cloud_platform.core.secrets import MasterKey; print(base64.urlsafe_b64encode(MasterKey.generate().material).decode())"
# Both are REQUIRED in production; changing the credential key makes existing
# encrypted provider credentials unreadable, so back it up before rotating.
provider_credential_encryption_key = "CHANGE_ME"
backup_encryption_key = "CHANGE_ME"

[billing]
price_book_name = "retail-usd"
customer_billing_quantum_seconds = 3600
low_balance_threshold_minor = 5000
low_balance_grace_hours = 24

[backup]
output_dir = "/var/backups/cloud-server-seller"
retention_days = 14

[observability]
otel_exporter_endpoint = ""        # e.g. http://otel-collector:4317
otel_sample_ratio = 1.0

[api]
allow_header_identity = false      # dev/test only; never in production
rate_limit_per_minute = 240

# What a paying customer may do from Telegram ("My servers").
# Capability groups combine with what the provider adapter actually supports
# and what the server's state allows; a group set to false simply hides its
# buttons. Destructive actions stay behind a one-time confirmation whatever
# the flags say.
[features.server_management]
enabled = true                     # the whole section
manager = true                     # details, refresh, rename
power = true                       # start / stop / reboot
console = true                     # temporary console link
traffic = true                     # data-traffic usage
snapshots = true                   # list / create / restore / delete
reinstall = true                   # OS reinstall (destructive)
password_reset = true              # OS password reset (destructive)  # pragma: allowlist secret
iso = false                        # attach/detach ISO (advanced, off by default)
ip_management = true               # list IPs, reverse DNS, null route
monitoring = true                  # monitoring status + enable
billing = true                     # renew-now + auto-renew toggle (local only)
page_size = 5                      # servers per Telegram page
traffic_window_days = 30           # trailing window for the traffic screen
confirmation_ttl_seconds = 900     # lifetime of a one-time confirmation

# ---------------------------------------------------------------------------
# Commercial service lifecycle
#
# This is the CUSTOMER billing lifecycle, deliberately separate from the
# provider's infrastructure state (a VPS can be RUNNING while its commercial
# state is PAYMENT_DUE). These settings never make a provider API call: they
# only drive local wallet collection, warnings and grace/suspension policy.
#
# The renewal amount always comes from the LOCAL commercial price stored on
# the service (its order/sale price snapshot) — never from a current provider
# quote. The provider renews its own contract at its own billing cycle; there
# is no provider renewal or cancellation endpoint in the VPS API, so nothing
# here can invent one.
# ---------------------------------------------------------------------------

[commerce.renewal]
enabled = true                     # run automatic wallet collection
charge_before_expiry_hours = 72    # earliest automatic charge attempt
warning_before_expiry_hours = [168, 72, 24]   # customer warnings, per period
grace_period_hours = 48            # payable window after expiry
# Default for a NEWLY provisioned service. Set false only if the product is
# explicitly opt-in; an existing service keeps its own stored setting.
auto_renew_default = true

[commerce.suspension]
# Suspension NEVER terminates, reinstalls or deletes a provider server. This
# flag only decides whether the application stops the VPS after grace expires;
# it stays off unless the operator deliberately opts in.
stop_server_after_grace = false

# Automatic catalog pricing policies live under [storefront.pricing.*] above.
# Foreign offers use the configured [fx] catalog_pricing_currency (USD).
